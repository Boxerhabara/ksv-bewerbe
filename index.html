<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSV Siemens Bewerbe</title>
<meta name="theme-color" content="#006a72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KSV Bewerbe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f7; --card:#fff; --ink:#1b2a30; --muted:#5d6f76; --line:#dde4e7;
  --acc:#00808a; --acc2:#006a72; --accsoft:#e3f3f4; --warn:#b4561b; --warnsoft:#fbeee5;
  --ok:#2c7a3f; --gold:#c9a227; --silver:#9aa4a8; --bronze:#b07a45; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121a1d;--card:#1b2529;--ink:#e6eef0;--muted:#97a9af;--line:#2c3a3f;--accsoft:#163538;--warnsoft:#3a271b;}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc2);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.logo{height:52px;width:52px;border-radius:50%;background:#fff;object-fit:cover;object-position:center;transform:scale(1);padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:0 0 auto}
header .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
@media (max-width:560px){.logo{height:38px;width:38px}header h1{font-size:16px}}
header nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header nav button{background:transparent;color:#fff;border:1px solid transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
header nav button.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 10px} h3{font-size:16px;margin:16px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 160px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
button,input,select,textarea,a{touch-action:manipulation}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}button.b{min-height:40px}}
.ser-small{white-space:normal}
@media (max-width:820px){.dg-bisher{display:none}}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
button.b{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;white-space:nowrap}
button.b:hover{background:var(--acc2)}
button.g{background:transparent;color:var(--acc);}
button.g:hover{background:var(--accsoft)}
button.d{border-color:var(--warn);background:transparent;color:var(--warn)}
button.sm{padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover{background:var(--accsoft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 14px;flex-wrap:wrap}
.tabs button{font:inherit;background:none;border:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accsoft);color:var(--acc2);white-space:nowrap}
@media (prefers-color-scheme:dark){.pill{color:#8fd6da}}
.pill.w{background:var(--warnsoft);color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bw{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);cursor:pointer}
.bw:hover{border-color:var(--acc)}
.bw h4{margin:0 0 4px;font-size:16px}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.series input{text-align:center;font-size:18px;font-variant-numeric:tabular-nums;padding:10px 4px}
.series input.bad,input.shot.bad{border-color:var(--warn);background:var(--warnsoft);color:var(--warn);font-weight:700;outline-color:var(--warn)}
.total{font-size:34px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.rank{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--line)}
.r1{background:var(--gold);color:#fff}.r2{background:var(--silver);color:#fff}.r3{background:var(--bronze);color:#fff}
.notice{background:var(--warnsoft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13.5px}
.info{background:var(--accsoft);border-left:4px solid var(--acc);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:20;overflow:auto}
.modal .card{max-width:640px;width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2a30;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.list-pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.list-pick div{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.list-pick div:hover{background:var(--accsoft)}
.tw{overflow-x:auto}
.ser-small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" title="Zur Bewerbsübersicht"><img class="logo" id="kopfLogo" alt="KSV Logo"><h1>KSV Siemens · Bewerbe</h1></div>
  <span class="badge" id="mode">Lokal</span>
  <nav>
    <button data-v="bewerbe">Bewerbe</button>
    <button data-v="schuetzen">Schützen</button>
    <button data-v="daten">Daten</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<div id="modalroot"></div>

<script>
"use strict";
/* ================= Grunddaten ================= */
const COLLS=["bewerbe","schuetzen","ergebnisse"];
const LK="ksv_bewerbe_v1";
const S={bewerbe:{},schuetzen:{},ergebnisse:{}};
let backend="local", db=null, downloads=null;
const UI={view:"bewerbe",bewerbId:null,tab:"wertung",filter:"gesamt",schuetzeEdit:null,erfassSid:null,editErg:null,suche:"",erfMode:"serie",dg:null,dgSerie:null};

const KLASSEN={
  F:"Frauen",SW1:"Seniorinnen 1",SW2:"Seniorinnen 2",SW3:"Seniorinnen 3",SW4:"Seniorinnen 4",
  M:"Männer",SM1:"Senioren 1",SM2:"Senioren 2",SM3:"Senioren 3",SM4:"Senioren 4",
  I:"Inter",G:"Gäste"
};
const KLASSEN_ORD=["F","SW1","SW2","SW3","SW4","M","SM1","SM2","SM3","SM4","I","G"];

const PROGRAMME={
  "3030voll":{name:"FFWGK 30/30 – 60 Schuss Vollprogramm",serien:[...rep(6,"150 s"),...rep(6,"20 s")]},
  "3030halb":{name:"FFWGK 30/30 – 30 Schuss Halbprogramm",serien:[...rep(3,"150 s"),...rep(3,"20 s")]},
  "2020":{name:"FFWGK 20/20 – 40 Schuss Vollprogramm",serien:[...rep(4,"150 s Präz."),...rep(4,"20 s")]},
  "frei":{name:"Freies Programm",serien:null}
};
function rep(n,l){return Array.from({length:n},(_,i)=>({label:l+" "+(i+1),schuss:5,maxRing:10}))}

const MODI={
  best:"Bestes Einzelergebnis zählt",
  bestN:"Summe der besten N Ergebnisse",
  sum:"Summe aller Ergebnisse",
  avg:"Durchschnitt aller Ergebnisse",
  last:"Letztes Ergebnis zählt"
};

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?d.split("-").reverse().join(".") : "";
const num=(v,dec)=>v==null||isNaN(v)?"–":(dec?Number(v).toFixed(1).replace(".",","):String(Math.round(v*10)/10).replace(".",","));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}
const sName=s=>s?`${s.nachname} ${s.vorname}`.trim():"(unbekannt)";

/* ================= Speicher ================= */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LK)||"null");if(j)COLLS.forEach(k=>S[k]=j[k]||{})}catch(e){}}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}}
function localHasData(){try{const j=JSON.parse(localStorage.getItem(LK)||"null");return j&&COLLS.some(k=>j[k]&&Object.keys(j[k]).length)}catch(e){return false}}
const queue={};
function dbWrite(path,fn){const p=(queue[path]||Promise.resolve()).then(fn).catch(e=>{
  const c=e&&e.code;toast(c==="quota_exceeded"?"Speicher voll – bitte alte Daten exportieren/löschen.":"Speichern fehlgeschlagen ("+(c||"Fehler")+")");});
  queue[path]=p;return p}
function put(coll,obj){
  obj.geaendert=new Date().toISOString();
  S[coll][obj.id]=JSON.parse(JSON.stringify(obj));
  if(backend==="db") dbWrite(coll+"/"+obj.id,()=>db.collection(coll).doc(obj.id).set(S[coll][obj.id]));
  else saveLocal();
  render(true);
}
function del(coll,id){
  delete S[coll][id];
  if(backend==="db") dbWrite(coll+"/"+id,()=>db.collection(coll).doc(id).delete());
  else saveLocal();
  render(true);
}
async function initDb(){
  if(!window.claude||!window.claude.use){return}
  try{downloads=await window.claude.use("downloads")}catch(e){}
  let d=null;try{d=await window.claude.use("db")}catch(e){}
  if(!d)return;
  db=d;backend="db";COLLS.forEach(k=>S[k]={});
  setMode("Cloud – lädt …");
  let pending=new Set(COLLS);
  const timer=setTimeout(()=>{if(pending.size)setMode("Cloud – nicht erreichbar");},10000);
  COLLS.forEach(k=>{
    db.collection(k).onSnapshot(snap=>{
      const o={};snap.docs.forEach(dc=>{if(dc.exists)o[dc.id]=dc.data()});S[k]=o;
      if(!snap.metadata.fromCache){pending.delete(k);if(!pending.size){clearTimeout(timer);setMode("Cloud ✓")}}
      render(true);
    },err=>{clearTimeout(timer);setMode("Cloud – Fehler");toast("Cloud-Speicher: "+err.code)});
  });
}
function setMode(t){$("#mode").textContent=t}

/* ================= Fachlogik ================= */
function refJahr(b){return Number(b.jahr)||Number((b.start||today()).slice(0,4))}
function altersKlasse(s,b){
  if(!s.geburtsjahr)return s.geschlecht==="w"?"F":"M";
  const a=refJahr(b)-Number(s.geburtsjahr); // im Kalenderjahr erreichtes Alter
  const w=s.geschlecht==="w";
  if(a>=77&&b.s4!==false)return w?"SW4":"SM4";
  if(a>=70)return w?"SW3":"SM3";
  if(a>=60)return w?"SW2":"SM2";
  if(a>=50)return w?"SW1":"SM1";
  return w?"F":"M";
}
function maennerKlasse(s,b){return altersKlasse({...s,geschlecht:"m"},b)}
function teilnahme(b,sid){return (b.teilnehmer||[]).find(t=>t.sid===sid)}
function klasseVon(b,sid){
  const t=teilnahme(b,sid);const s=S.schuetzen[sid];if(!s)return "M";
  if(t&&t.gast)return "G";
  if(t&&t.klasse)return t.klasse;
  if(s.geschlecht==="x"){
    if(b.interFallback!==false){
      const nInter=(b.teilnehmer||[]).filter(x=>{const y=S.schuetzen[x.sid];return y&&y.geschlecht==="x"&&!x.gast}).length;
      if(nInter<5)return maennerKlasse(s,b);
    }
    return "I";
  }
  return altersKlasse(s,b);
}
/* Serien-Eingabe: Summe ("47"), Summe + X ("47xx" = 47 Ringe, davon 2 X) oder Einzelschüsse ("x 10 9 9 8"). x = 10er-Treffer (Innenzehner). */
function parseSerie(str,se,zehntel){
  let s=String(str??"").trim().toLowerCase();if(!s)return {leer:true,ok:true};
  s=s.replace(/(\d),(\d)/g,"$1.$2");
  const maxR=Number(se.maxRing)||10,sch=Number(se.schuss)||5,mx=maxSerie(se);
  const parts=s.split(/[\s,;+\/]+/).filter(Boolean);let v=0,x=0;
  if(parts.length>1){
    if(parts.length>sch)return {ok:false};
    for(const p of parts){if(/^x+$/.test(p)){x+=p.length;v+=maxR*p.length}else if(/^\d+(\.\d+)?$/.test(p)&&+p<=maxR){v+=+p}else return {ok:false}}
  }else{
    const m=parts[0].match(/^(x*)(\d+(?:\.\d+)?)?(x*)$/);if(!m)return {ok:false};
    x=m[1].length+m[3].length;v=m[2]!=null?+m[2]:maxR*x;
  }
  v=Math.round(v*10)/10;
  const ok=v>=0&&v<=mx&&x<=sch&&x*maxR<=v&&(zehntel||Number.isInteger(v));
  return {ok,v,x};
}
function serText(v,x){return v==null||v===""?"":String(v).replace(".",",")+(x?"x".repeat(x):"")}
function serAnzeige(v,x){return v==null||v===""?"·":num(v)+(x?`<sup style="color:var(--acc);font-weight:700">${x}x</sup>`:"")}
function xSumme(r){return (r.xs||[]).reduce((a,v)=>a+(Number(v)||0),0)}
function maxSerie(se){return (Number(se.schuss)||5)*(Number(se.maxRing)||10)}
function maxGesamt(b){return (b.serien||[]).reduce((a,s)=>a+maxSerie(s),0)}
function tiebreakCmp(a,b){ // a,b Serienarrays – FFWGK 8.2.1: Summe der letzten beiden Serien, dann davor ...
  const n=Math.max(a.length,b.length);
  for(let i=n-1;i>=0;i-=2){
    const sa=(a[i]||0)+(a[i-1]||0), sb=(b[i]||0)+(b[i-1]||0);
    if(sa!==sb)return sb-sa;
  }
  return 0;
}
function auswertung(b){
  const erg=Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id);
  const per={};
  erg.forEach(r=>{if(r.sid&&S.schuetzen[r.sid]&&komplett(b,r))(per[r.sid]=per[r.sid]||[]).push(r)});
  const rows=[];
  Object.keys(per).forEach(sid=>{
    const list=per[sid].sort((x,y)=>(x.datum||"").localeCompare(y.datum||"")||(x.erstellt||"").localeCompare(y.erstellt||""));
    const sorted=[...list].sort((x,y)=>y.total-x.total||xSumme(y)-xSumme(x)||tiebreakCmp(x.serien,y.serien));
    let wert,zaehlt;
    switch(b.modus){
      case "bestN":{const n=Math.max(1,Number(b.bestN)||2);zaehlt=sorted.slice(0,n);wert=zaehlt.reduce((a,r)=>a+r.total,0);break}
      case "sum":zaehlt=list;wert=list.reduce((a,r)=>a+r.total,0);break;
      case "avg":zaehlt=list;wert=list.reduce((a,r)=>a+r.total,0)/list.length;break;
      case "last":zaehlt=[list[list.length-1]];wert=zaehlt[0].total;break;
      default:zaehlt=[sorted[0]];wert=sorted[0].total;
    }
    const tb=b.modus==="last"?zaehlt[0].serien:sorted[0].serien;
    const xs=b.modus==="best"?xSumme(sorted[0]):b.modus==="last"?xSumme(zaehlt[0]):zaehlt.reduce((a,r)=>a+xSumme(r),0);
    const s=S.schuetzen[sid];
    rows.push({sid,s,wert,tb,xs,antritte:list.length,bestes:sorted[0].total,zaehlt,klasse:klasseVon(b,sid),
      geschlecht:s?s.geschlecht:"m",gast:!!(teilnahme(b,sid)||{}).gast,
      unvollstaendig:b.modus==="bestN"&&list.length<(Number(b.bestN)||2)});
  });
  rows.sort((x,y)=>y.wert-x.wert||y.xs-x.xs||tiebreakCmp(x.tb,y.tb)||sName(x.s).localeCompare(sName(y.s)));
  return rows;
}
function rangiere(rows){
  let last=null,rang=0;
  return rows.map((r,i)=>{
    if(!last||r.wert!==last.wert||r.xs!==last.xs||tiebreakCmp(r.tb,last.tb)!==0)rang=i+1;
    last=r;return {...r,rang};
  });
}

/* ================= Rendering ================= */
document.querySelectorAll("header nav button").forEach(bt=>bt.onclick=()=>{UI.view=bt.dataset.v;UI.bewerbId=null;location.hash=bt.dataset.v;render()});
document.addEventListener("input",e=>{if(e.target&&e.target.id&&e.target.closest&&e.target.closest("#app"))e.target.dataset.dirty="1"});
function clearDirty(){document.querySelectorAll("#app [data-dirty]").forEach(e=>delete e.dataset.dirty)}
function render(keepInputs){
  const dirty={};if(keepInputs)document.querySelectorAll("#app [data-dirty='1']").forEach(e=>{if(e.id&&e.tagName!=="SELECT"&&e.type!=="checkbox")dirty[e.id]=e.value});
  document.querySelectorAll("header nav button").forEach(bt=>bt.classList.toggle("on",bt.dataset.v===UI.view));
  const a=$("#app");
  const fa=document.activeElement; const keep=fa&&fa.id?{id:fa.id,ss:fa.selectionStart,se:fa.selectionEnd}:null;
  if(UI.view==="bewerbe")a.innerHTML=UI.bewerbId&&S.bewerbe[UI.bewerbId]?vBewerb():vBewerbe();
  else if(UI.view==="schuetzen")a.innerHTML=vSchuetzen();
  else a.innerHTML=vDaten();
  bind();
  Object.entries(dirty).forEach(([id,v])=>{const e=document.getElementById(id);if(e&&e.value!==v){e.value=v;e.dataset.dirty="1";if(e.classList.contains("ser"))e.dispatchEvent(new Event("input"));if(e.classList.contains("shot"))e.dispatchEvent(new Event("change"))}else if(e)e.dataset.dirty="1"});
  if(keep){const e=document.getElementById(keep.id);if(e){e.focus();try{e.setSelectionRange(keep.ss,keep.se)}catch(x){}}}
}

function vBewerbe(){
  const list=Object.values(S.bewerbe).sort((a,b)=>(b.start||"").localeCompare(a.start||""));
  const aktiv=list.filter(b=>b.status!=="abgeschlossen"),alt=list.filter(b=>b.status==="abgeschlossen");
  const card=b=>{
    const n=(b.teilnehmer||[]).length, e=Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id).length;
    return `<div class="bw" data-open="${b.id}"><h4>${esc(b.name)}</h4>
    <div class="small muted">${esc(PROGRAMME[b.programm]?.name||"Freies Programm")}</div>
    <div class="small" style="margin-top:6px">${fmtD(b.start)}${b.ende?" – "+fmtD(b.ende):""}</div>
    <div class="flex" style="margin-top:8px"><span class="pill">${n} Teilnehmer</span><span class="pill">${e} Antritte</span>
    ${b.umlauf?'<span class="pill">Umlaufbewerb</span>':""}${b.status==="abgeschlossen"?'<span class="pill w">abgeschlossen</span>':""}</div></div>`};
  return `<div class="flex"><h2 class="sp">Bewerbe</h2><button class="b" id="neuBewerb">+ Neuer Bewerb</button></div>
  ${list.length?"":`<div class="card info">Noch keine Bewerbe angelegt. Lege mit „+ Neuer Bewerb“ den ersten an – z. B. einen Umlaufbewerb über mehrere Monate.</div>`}
  ${aktiv.length?`<div class="grid">${aktiv.map(card).join("")}</div>`:""}
  ${alt.length?`<h3>Abgeschlossen</h3><div class="grid">${alt.map(card).join("")}</div>`:""}`;
}

function vBewerb(){
  const b=S.bewerbe[UI.bewerbId];
  const tabs=[["wertung","Wertung"],["erfassung","Ergebnis erfassen"],["teilnehmer",`Teilnehmer (${(b.teilnehmer||[]).length})`],["antritte","Alle Antritte"],["einstellungen","Einstellungen"]];
  let body="";
  if(UI.tab==="wertung")body=vWertung(b);
  else if(UI.tab==="erfassung")body=vErfassung(b);
  else if(UI.tab==="teilnehmer")body=vTeilnehmer(b);
  else if(UI.tab==="antritte")body=vAntritte(b);
  else body=vBewerbForm(b);
  return `<div class="flex"><button class="b g sm" id="zurueck">← Bewerbe</button></div>
  <div class="flex" style="margin-top:8px"><h2 class="sp" style="margin:0">${esc(b.name)}</h2>
  <span class="small muted">${fmtD(b.start)}${b.ende?" – "+fmtD(b.ende):""} · max. ${maxGesamt(b)} Ringe · ${esc(MODI[b.modus]?.replace("N",b.bestN||2)||"")}</span></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${UI.tab===k?"on":""}">${l}</button>`).join("")}</div>${body}`;
}

function vWertung(b){
  const all=rangiere(auswertung(b));
  const offen=ohneNamen(b).length;
  const laufend=Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&!komplett(b,r)).length;
  const offenHinweis=(laufend?`<div class="info">${laufend} Ergebnis${laufend===1?"":"se"} noch nicht vollständig (Durchgang läuft) – zählt erst nach der letzten Serie.</div>`:"")+(offen?`<div class="notice">${offen} Ergebnis${offen===1?"":"se"} noch ohne Namen – zählt erst nach der Zuordnung. <button class="b g sm" data-tab="antritte">Jetzt zuordnen</button></div>`:"");
  if(!all.length)return offenHinweis+`<div class="card info">Noch keine gewerteten Ergebnisse. Unter „Ergebnis erfassen“ eintragen.</div>`;
  const klassenVorh=KLASSEN_ORD.filter(k=>all.some(r=>r.klasse===k));
  const filters=[["gesamt","Gesamt"],["w","Damen"],["m","Herren"],...(all.some(r=>r.geschlecht==="x")?[["x","Inter"]]:[]),...klassenVorh.map(k=>["k:"+k,KLASSEN[k]]),["klassen","Alle Klassen"]];
  if(!filters.some(f=>f[0]===UI.filter))UI.filter="gesamt";
  let html=offenHinweis+`<div class="chips">${filters.map(([k,l])=>`<button class="chip ${UI.filter===k?"on":""}" data-filter="${k}">${l}</button>`).join("")}</div>`;
  const tbl=(rows,titel,hinweis)=>{
    rows=rangiere(rows);
    const multi=b.modus!=="best"&&b.modus!=="last";
    return `<div class="card"><div class="flex"><h3 class="sp" style="margin:0">${esc(titel)}</h3><span class="small muted">${rows.length} Starter</span></div>${hinweis||""}
    <div class="tw"><table><thead><tr><th>Rang</th><th>Name</th><th>Verein</th><th>Klasse</th><th class="n">Antritte</th>${multi?'<th class="n">Bestes</th>':""}<th class="n">Wertung</th><th class="n">X</th><th>Serien (gewertet)</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><span class="rank r${r.rang<=3?r.rang:""}">${r.rang}</span></td>
      <td><b>${esc(sName(r.s))}</b>${r.unvollstaendig?' <span class="pill w" title="Noch nicht genug Antritte">offen</span>':""}</td>
      <td>${esc(r.s?.verein||"")}</td><td><span class="pill">${KLASSEN[r.klasse]}</span></td>
      <td class="n">${r.antritte}</td>${multi?`<td class="n">${num(r.bestes)}</td>`:""}
      <td class="n"><b style="font-size:16px">${num(r.wert,b.modus==="avg")}</b></td>
      <td class="n">${r.xs||0}</td>
      <td class="ser-small">${(()=>{const best=b.modus==="last"?r.zaehlt[0]:[...r.zaehlt].sort((p,q)=>q.total-p.total||xSumme(q)-xSumme(p))[0];return (best.serien||[]).map((v,i)=>serAnzeige(v,(best.xs||[])[i])).join(" · ")})()}</td></tr>`).join("")}
    </tbody></table></div></div>`};
  const wertbar=rows=>{
    const n=rows.filter(r=>!r.gast).length, v=new Set(rows.filter(r=>!r.gast).map(r=>(r.s?.verein||"").trim().toLowerCase())).size;
    return (b.minHinweis!==false&&(n<5||v<2))?`<div class="notice">Laut FFWGK 2.1.1 nicht wertbar für Meistertitel: mind. 5 Startende aus mind. 2 Vereinen nötig (aktuell ${n} Startende, ${v} Verein${v===1?"":"e"}).</div>`:""};
  const f=UI.filter;
  if(f==="gesamt")html+=tbl(all,"Gesamtwertung");
  else if(f==="w"||f==="m"||f==="x")html+=tbl(all.filter(r=>r.geschlecht===f&&!r.gast),f==="w"?"Damen – alle Klassen":f==="m"?"Herren – alle Klassen":"Inter");
  else if(f==="klassen")klassenVorh.forEach(k=>{const r=all.filter(x=>x.klasse===k);html+=tbl(r,KLASSEN[k],k==="G"?"":wertbar(r))});
  else {const k=f.slice(2);const r=all.filter(x=>x.klasse===k);html+=tbl(r,KLASSEN[k],k==="G"?"":wertbar(r))}
  html+=`<div class="right"><button class="b" id="xlsxListe">📊 Ergebnisliste als Excel</button><button class="b g" id="csvWertung">CSV</button><button class="b g" id="txtWertung">Text kopieren</button></div>
  <p class="small muted">Reihung bei Ringgleichheit: 1. mehr X (Innenzehner), 2. Summe der beiden letzten Serien (20-s-Serien), dann der beiden davor usw. (FFWGK 8.2.1).</p>`;
  return html;
}

function vErfassung(b){
  if(UI.editErg&&S.ergebnisse[UI.editErg])return vKomplett(b); // nur zum Bearbeiten eines fertigen Ergebnisses
  return vDurchgang(b);
}
function komplett(b,r){const n=(b.serien||[]).length;return Array.isArray(r.serien)&&r.serien.length>=n&&r.serien.slice(0,n).every(v=>v!=null&&v!=="")}
function summe(r){return Math.round((r.serien||[]).reduce((a,v)=>a+(v==null||v===""?0:Number(v)),0)*10)/10}
function durchgaenge(b){
  const g={};Object.values(S.ergebnisse).forEach(r=>{if(r.bewerbId===b.id&&r.dg)(g[r.dg]=g[r.dg]||[]).push(r)});
  return Object.entries(g).map(([id,rows])=>{rows.sort((x,y)=>(Number(x.stand)||999)-(Number(y.stand)||999));
    const start=rows.map(r=>r.erstellt||"").sort()[0]||"";
    return {id,rows,start,datum:rows[0].datum,fertig:rows.every(r=>komplett(b,r))}})
    .sort((x,y)=>x.start.localeCompare(y.start)).map((d,i)=>({...d,nr:i+1})).reverse(); // Nr. fortlaufend nach Startzeit
}
function dgTitel(b,nr){return `Durchgang ${nr} – ${esc(b.name)}`}
function dgNr(b,id){const d=durchgaenge(b).find(x=>x.id===id);return d?d.nr:null
}
function naechsteSerie(b,rows){const n=(b.serien||[]).length;for(let i=0;i<n;i++)if(rows.some(r=>r.serien[i]==null||r.serien[i]===""))return i;return n-1}
function uhr(iso){try{return new Date(iso).toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function vDurchgang(b){
  const alle=durchgaenge(b);
  const dg=UI.dg&&alle.find(d=>d.id===UI.dg);
  if(!dg){
    UI.dg=null;
    const offen=alle.filter(d=>!d.fertig).sort((x,y)=>x.nr-y.nr),fertig=alle.filter(d=>d.fertig).sort((x,y)=>x.nr-y.nr);
    return `<div class="card"><div class="flex"><h3 class="sp" style="margin:0">Neuer ${dgTitel(b,alle.length+1)}</h3><span class="pill">${alle.length} Durchgang${alle.length===1?"":"e"} bisher · ${fertig.length} abgeschlossen</span></div>
    <p class="small muted">Alle Schützen eines Durchgangs schießen gleichzeitig. Nach jeder Serie werden die Ringe aller Stände eingetragen und gespeichert – dann folgt die nächste Serie.</p>
    <div class="row"><div style="flex:2 1 220px"><label>Stände (z. B. 1-5 oder 1,2,4,7)</label><input id="dgStaende" value="${esc(b.letzteStaende||"1-5")}"></div>
    <div><label>Datum</label><input type="date" id="dgDatum" value="${today()}"></div>
    <div style="flex:0 0 auto"><button class="b" id="dgStart">Durchgang starten</button></div></div>
    <p class="small muted">Die Namen ordnest du im Durchgang direkt je Stand zu – jederzeit, auch erst nach der letzten Serie.</p></div>
    ${offen.length?`<div class="card"><h3 style="margin-top:0">Laufende Durchgänge</h3>${offen.map(d=>`<div class="flex" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="sp"><b>${dgTitel(b,d.nr)}</b> · ${fmtD(d.datum)} · ${uhr(d.start)} – Stände ${d.rows.map(r=>esc(r.stand||"?")).join(", ")}
      <div class="small muted">nächste: ${esc((b.serien[naechsteSerie(b,d.rows)]||{}).label||"")} (Serie ${naechsteSerie(b,d.rows)+1} von ${b.serien.length})</div></div><button class="b sm" data-dgopen="${d.id}">Fortsetzen</button></div>`).join("")}</div>`:""}
    ${fertig.length?`<div class="card"><h3 style="margin-top:0">Abgeschlossene Durchgänge (${fertig.length})</h3>${fertig.map(d=>`<div class="flex" style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="sp small"><b>${dgTitel(b,d.nr)}</b> · ${fmtD(d.datum)} · ${uhr(d.start)} – ${d.rows.map(r=>`${esc(r.stand)}: ${r.sid&&S.schuetzen[r.sid]?esc(sName(S.schuetzen[r.sid])):"<i>ohne Namen</i>"} <b>${num(summe(r))}</b>`).join(" · ")}</div><button class="b g sm" data-dgopen="${d.id}">Öffnen</button></div>`).join("")}</div>`:""}`;
  }
  const n=b.serien.length;
  let si=UI.dgSerie;if(si==null||si<0||si>=n)si=naechsteSerie(b,dg.rows);
  UI.dgAktiv=si;
  const step=b.zehntel?"0.1":"1",mx=maxSerie(b.serien[si]);
  return `<div class="card">
  <div class="flex"><button class="b g sm" id="dgBack">← Übersicht</button><h3 class="sp" style="margin:0">${dgTitel(b,dg.nr)} <span class="muted small" style="font-weight:400">· ${fmtD(dg.datum)} · ${uhr(dg.start)}</span></h3>${dg.fertig?'<span class="pill">vollständig ✓</span>':'<span class="pill w">läuft</span>'}</div>
  <label style="margin-top:12px">Serie wählen</label>
  <div class="chips">${b.serien.map((s,i)=>{const done=dg.rows.every(r=>r.serien[i]!=null&&r.serien[i]!=="");return `<button class="chip ${i===si?"on":""}" data-dgserie="${i}">${done?"✓ ":""}${esc(s.label)}</button>`}).join("")}</div>
  <div class="flex" style="margin:6px 0 4px"><div class="total" style="font-size:24px">Serie ${si+1} von ${n}: ${esc(b.serien[si].label)}</div><span class="muted small">${b.serien[si].schuss||5} Schuss · je Schuss max. ${b.serien[si].maxRing||10} Ringe</span></div>
  <div class="tw"><table><thead><tr><th>Stand</th><th>Name</th><th class="dg-bisher">Bisher</th><th>Schüsse ${esc(b.serien[si].label)}</th><th class="n">Summe</th><th></th></tr></thead><tbody>
  ${dg.rows.map((r,ix)=>{const vorher=r.serien.slice(0,n).map((v,i)=>i===si?"□":serAnzeige(v,(r.xs||[])[i])).join(" ");
    return `<tr><td style="font-size:20px;font-weight:700">${esc(r.stand||"–")}</td>
    <td>${namensZelle(b,r)}</td>
    <td class="ser-small dg-bisher">${vorher}</td>
    <td><div class="flex" style="gap:4px;flex-wrap:nowrap">${(()=>{const sch=Number(b.serien[si].schuss)||5;const alt=String((r.schuss||[])[si]||"").split(",");
      return Array.from({length:sch},(_,k)=>`<input type="text" autocomplete="off" class="shot" id="sh_${r.id}_${si}_${k}" data-rid="${r.id}" data-k="${k}" inputmode="numeric" maxlength="3" value="${esc(alt[k]||"")}" style="text-align:center;font-size:19px;padding:8px 2px;width:46px">`).join("")})()}
      <button class="b g" data-rowx="${r.id}" tabindex="-1" title="X (Innenzehner) in das aktuelle bzw. nächste freie Feld" style="padding:8px 12px;margin-left:4px">x</button></div>
      ${r.serien[si]!=null&&r.serien[si]!==""&&!(r.schuss||[])[si]?`<div class="small muted">gespeichert: ${serAnzeige(r.serien[si],(r.xs||[])[si])} (ohne Einzelschüsse)</div>`:""}</td>
    <td class="n"><b id="dgsum_${r.id}">${num(summe(r))}</b><div class="small" style="color:var(--acc)" id="dgx_${r.id}">${xSumme(r)?xSumme(r)+"x":""}</div></td>
    <td class="n">${r.serien.every(v=>v==null||v==="")?`<button class="b d sm" data-dgdel="${r.id}" title="Stand aus dem Durchgang entfernen">×</button>`:""}</td></tr>`}).join("")}
  </tbody></table></div>
  <div id="dgWarn"></div><div id="dgWarnName"></div>
  <div class="flex" style="margin-top:12px"><div class="flex sp"><input id="dgAddStand" type="number" min="1" placeholder="Stand Nr." style="width:110px"><button class="b g sm" id="dgAdd">+ Stand hinzufügen</button></div>
  <button class="b" id="dgSave" style="font-size:16px;padding:10px 20px">Serie ${si+1} speichern${si<n-1?" → weiter":""}</button></div>
  <p class="small muted">Eingabe je Schuss: 0–10 oder x (Innenzehner = 10 Ringe). Werte über 10 werden als Warnung markiert und nicht gespeichert. Mit Enter oder Tab geht es ins nächste Feld. Gespeichert wird erst mit „Serie … speichern“. Leere Felder bleiben offen und können später nachgetragen werden. Bereits gespeicherte Serien lassen sich über „Serie wählen“ korrigieren.</p>
  </div>`;
}
function vKomplett(b){
  const tn=(b.teilnehmer||[]).map(t=>S.schuetzen[t.sid]).filter(Boolean).sort((x,y)=>sName(x).localeCompare(sName(y)));

  const vorh=sid?Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&r.sid===sid):[];
  const maxA=Number(b.maxAntritte)||0;
  const voll=!edit&&maxA&&vorh.length>=maxA;
  const step=b.zehntel?"0.1":"1";
  const standWert=edit?(edit.stand||""):(UI.erfassStand||"");
  return `<div class="card">
  <h3 style="margin-top:0">${edit?"Ergebnis bearbeiten":"Neues Ergebnis"}</h3>
  <div class="row">
    <div style="flex:0 0 110px"><label>Stand Nr.</label><input type="number" min="1" inputmode="numeric" id="eStand" value="${esc(standWert)}" placeholder="–"></div>
    <div style="flex:2 1 240px"><label>Schütze/Schützin</label>
      <select id="eSid"><option value="">– später zuordnen –</option>${tn.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(sName(s))}${s.verein?" ("+esc(s.verein)+")":""}</option>`).join("")}</select></div>
    <div><label>Datum</label><input type="date" id="eDatum" value="${edit?edit.datum:today()}"></div>
    <div style="flex:0 0 auto"><button class="b g" id="schnellNeu" title="Neuen Teilnehmer sofort anlegen">+ Neuer Teilnehmer</button></div>
  </div>
  ${sid?`<p class="small muted">Klasse: <b>${KLASSEN[klasseVon(b,sid)]}</b> · bisherige Antritte: ${vorh.length}${maxA?" / "+maxA:""}${vorh.length?" · bisher bestes: "+num(Math.max(...vorh.map(r=>r.total))):""}</p>`:""}
  ${voll?`<div class="notice">Maximale Anzahl an Antritten (${maxA}) erreicht.</div>`:""}
  <h3>Serien</h3>
  <div class="series">${(b.serien||[]).map((se,i)=>`<div><label style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(se.label)}</label>
    <div class="flex" style="gap:4px;flex-wrap:nowrap"><input type="text" autocomplete="off" placeholder="max ${maxSerie(se)}" inputmode="decimal" class="ser" id="ser${i}" data-i="${i}" value="${edit?esc(serText(edit.serien[i],(edit.xs||[])[i])):""}" style="min-width:0"><button class="b g sm xbtn" data-addx="ser${i}" tabindex="-1" title="X (Innenzehner) hinzufügen">x</button></div></div>`).join("")}</div>
  <div class="flex" style="margin-top:14px"><div class="sp"><div class="small muted">Gesamt</div><div class="total" id="eTotal">0</div><div class="small muted" id="eX"></div></div>
  <div style="flex:2 1 220px"><label>Notiz (optional)</label><input id="eNotiz" value="${esc(edit?edit.notiz:"")}"></div></div>
  <div class="right">${edit?`<button class="b g" id="eAbbr">Abbrechen</button>`:""}<button class="b" id="eSave" ${voll?"disabled":""}>${edit?"Änderung speichern":"Speichern"}</button></div>
  <p class="small muted">Eingabe je Serie: Summe (47), Summe mit X (47xx) oder Einzelschüsse (x 10 9 9 8) – die x-Taste hängt ein X an. Serien mit Enter durchtippen – nach der letzten Serie wird gespeichert. Den Namen musst du nicht sofort wählen: Ergebnisse ohne Namen kannst du unten (oder unter „Alle Antritte“) nachträglich zuordnen.</p>
  </div>
  ${offen.length?`<div class="card" style="border-color:var(--warn)"><div class="flex"><h3 class="sp" style="margin:0">Ohne Namen (${offen.length})</h3>
</div>
  <p class="small muted">Diese Ergebnisse zählen erst in der Wertung, wenn ein Name zugeordnet ist.</p>${tblAntritte(b,offen)}</div>`:""}
  ${sid&&vorh.length?`<div class="card"><h3 style="margin-top:0">Antritte von ${esc(sName(S.schuetzen[sid]))}</h3>${tblAntritte(b,vorh)}</div>`:""}`;
}

function ohneNamen(b){return Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&!(r.sid&&S.schuetzen[r.sid]))}
function namensZelle(b,r){
  const hat=r.sid&&S.schuetzen[r.sid];
  if(hat&&UI.nameEdit!==r.id)return `<b>${esc(sName(S.schuetzen[r.sid]))}</b> <button class="b g sm" data-namechg="${r.id}" title="Namen ändern">ändern</button>`;
  return namensAuswahl(b,r)+(hat?` <button class="b g sm" data-namecancel="1">Abbrechen</button><div class="small muted">bisher: ${esc(sName(S.schuetzen[r.sid]))}</div>`:"");
}
function namensAuswahl(b,r){
  const tnIds=new Set((b.teilnehmer||[]).map(t=>t.sid));
  const tn=[...tnIds].map(id=>S.schuetzen[id]).filter(Boolean).sort((x,y)=>sName(x).localeCompare(sName(y)));
  const rest=Object.values(S.schuetzen).filter(s=>!tnIds.has(s.id)).sort((x,y)=>sName(x).localeCompare(sName(y)));
  return `<select data-assign="${r.id}" style="min-width:190px;border-color:var(--warn)"><option value="">– Namen zuordnen –</option>
  ${tn.length?`<optgroup label="Gemeldete Teilnehmer">${tn.map(s=>`<option value="${s.id}">${esc(sName(s))}</option>`).join("")}</optgroup>`:""}
  ${rest.length?`<optgroup label="Weitere Personen (werden gemeldet)">${rest.map(s=>`<option value="${s.id}">${esc(sName(s))}</option>`).join("")}</optgroup>`:""}
  <option value="__neu">+ Neue Person anlegen …</option>${r.sid?`<option value="__weg">– Zuordnung entfernen –</option>`:""}</select>`;
}
function zuordnen(bid,rid,sid){
  const r=S.ergebnisse[rid];if(!r||!sid)return;
  put("ergebnisse",{...r,sid});
  let cur=S.bewerbe[bid];
  if(!teilnahme(cur,sid))cur={...cur,teilnehmer:[...(cur.teilnehmer||[]),{sid,klasse:"",gast:false,gemeldet:r.datum||today()}]};
  if(cur!==S.bewerbe[bid])put("bewerbe",cur);
  toast(`${r.stand?"Stand "+r.stand:"Ergebnis "+num(r.total)} → ${sName(S.schuetzen[sid])}`);
}
function tblAntritte(b,list){

  ${list.map(r=>`<tr><td>${fmtD(r.datum)}</td><td>${r.dg?(dgNr(b,r.dg)||"–"):"–"}</td><td>${esc(r.stand||"–")}</td><td>${namensZelle(b,r)}</td><td class="ser-small">${(r.serien||[]).map((v,i)=>serAnzeige(v,(r.xs||[])[i])).join(" · ")}</td>
  <td class="n"><b>${num(summe(r))}</b>${xSumme(r)?` <span class="small" style="color:var(--acc)">${xSumme(r)}x</span>`:""}${komplett(b,r)?"":`<div><span class="pill w">läuft ${r.serien.filter(v=>v!=null&&v!=="").length}/${b.serien.length}</span></div>`}</td><td class="small">${esc(r.notiz||"")}</td>
  <td class="n" style="white-space:nowrap"><button class="b g sm" data-editerg="${r.id}">Bearbeiten</button> <button class="b d sm" data-delerg="${r.id}">Löschen</button></td></tr>`).join("")}
  </tbody></table></div>`;
}

function vAntritte(b){
  const list=Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id);
  if(!list.length)return `<div class="card info">Noch keine Antritte.</div>`;
  return `<div class="card">${tblAntritte(b,list)}</div><div class="right"><button class="b g" id="csvAntritte">Antritte als CSV</button></div>`;
}

function vTeilnehmer(b){

const IST_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
async function anbieten(filename,text,mime){
  const blob=text instanceof Blob?text:new Blob([text],{type:mime});
  if(downloads){try{await downloads.save({filename,data:blob});return}catch(e){if(e&&e.code==="declined")return}}
  if(IST_IOS&&navigator.canShare){ // iPad/iPhone: Teilen-Menü (In Dateien sichern, AirDrop, Mail …)
    try{const f=new File([blob],filename,{type:mime||blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}
    catch(e){if(e&&e.name==="AbortError")return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast("Datei „"+filename+"“ wird gespeichert.");return}catch(e){}
  if(typeof text==="string")kopieren(text,"Download nicht möglich – Inhalt wurde in die Zwischenablage kopiert.");else toast("Download nicht möglich.");
}
async function kopieren(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||"In die Zwischenablage kopiert.")}catch(e){
  modal(`<h3 style="margin-top:0">Zum Kopieren markieren</h3><textarea rows="12" id="cpT">${esc(text)}</textarea><div class="right"><button class="b" id="cpX">Schließen</button></div>`,()=>{$("#cpT").select();$("#cpX").onclick=closeModal})}}
const csvCell=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function wertungCSV(b){
  const rows=rangiere(auswertung(b));
  const head=["Rang","Nachname","Vorname","Verein","Jahrgang","Geschlecht","Klasse","Antritte","Wertung","X",...(b.serien||[]).map(s=>s.label)];
  const lines=[head.join(";")];
  rows.forEach(r=>lines.push([r.rang,r.s?.nachname,r.s?.vorname,r.s?.verein,r.s?.geburtsjahr,r.geschlecht,KLASSEN[r.klasse],r.antritte,num(r.wert,b.modus==="avg"),r.xs||0,...(r.tb||[]).map(v=>num(v))].map(csvCell).join(";")));
  return "﻿"+lines.join("\r\n");
}
function wertungText(b){
  const all=rangiere(auswertung(b));let t=`${b.name}\n${fmtD(b.start)}${b.ende?" – "+fmtD(b.ende):""}\n`;
  const block=(titel,rows)=>{rows=rangiere(rows);if(!rows.length)return;t+=`\n${titel}\n`;rows.forEach(r=>t+=`${String(r.rang).padStart(3)}. ${sName(r.s)}${r.s?.verein?" ("+r.s.verein+")":""} – ${num(r.wert,b.modus==="avg")}${r.xs?" ("+r.xs+"x)":""}\n`)};
  block("GESAMT",all);
  KLASSEN_ORD.forEach(k=>block(KLASSEN[k].toUpperCase(),all.filter(r=>r.klasse===k)));
  return t;
}

function trefferZaehlen(b,r){ // aus den Einzelschüssen; null wenn nicht für alle Serien vorhanden
  const n=(b.serien||[]).length,c={X:0,10:0,9:0,8:0,7:0,6:0,5:0,"1-4":0,F:0};
  for(let i=0;i<n;i++){const t=(r.schuss||[])[i];if(!t)return null;
    t.split(",").forEach(s=>{s=s.trim().toLowerCase();if(s==="x")c.X++;else{const v=Number(s);if(v===0)c.F++;else if(v>=5)c[v]++;else c["1-4"]++}})}
  return c;
}
function listeDaten(b){
  const rows=rangiere(auswertung(b));
  const maxDG=Math.max(1,...rows.map(r=>r.antritte));
  const chrono=sid=>Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&r.sid===sid&&komplett(b,r)).sort((x,y)=>(x.datum||"").localeCompare(y.datum||"")||(x.erstellt||"").localeCompare(y.erstellt||""));
  const note=(a,o)=>a.xs!==o.xs?(a.xs>o.xs?"Mehr X":"Weniger X"):(()=>{const c=tiebreakCmp(a.tb,o.tb);return c<0?"Bessere Schlussserien":c>0?"Schwächere Schlussserien":"Gleichstand"})();
  rows.forEach((r,i)=>{
    r.dgs=chrono(r.sid);
    let bi=0;r.dgs.forEach((e,k)=>{const be=r.dgs[bi];if(e.total>be.total||(e.total===be.total&&xSumme(e)>xSumme(be)))bi=k});r.bestIdx=bi;
    const anm=[];const pre=r.dgs.length>1?`DG${bi+1}: `:"";
    const prev=rows[i-1],next=rows[i+1];
    if(prev&&prev.wert===r.wert)anm.push(pre+note(r,prev));else if(next&&next.wert===r.wert)anm.push(pre+note(r,next));
    r.dgs.forEach((e,k)=>{if(e.notiz)anm.push((r.dgs.length>1?`DG${k+1}: `:"")+e.notiz)});
    r.anm=anm.join("; ");
  });
  const details=[];
  rows.forEach(r=>r.dgs.forEach((e,k)=>details.push({name:sName(r.s),dg:k+1,c:trefferZaehlen(b,e),total:e.total,xs:xSumme(e),notiz:e.notiz||""})));
  details.sort((x,y)=>y.total-x.total||y.xs-x.xs||x.name.localeCompare(y.name));
  const daten=[...new Set(Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&komplett(b,r)).map(r=>r.datum).filter(Boolean))].sort();
  const klassen=KLASSEN_ORD.filter(k=>rows.some(r=>r.klasse===k)).map(k=>({k,rows:rangiere(rows.filter(r=>r.klasse===k))}));
  const anzDG=durchgaenge(b).filter(d=>d.fertig).length;
  return {rows,maxDG,details,daten,klassen,anzDG};
}
function datumText(d){if(!d.length)return "";if(d.length===1)return "am "+fmtD(d[0]);if(d.length===2)return `am ${fmtD(d[0])} und am ${fmtD(d[1])}`;
  if(d.length<=4)return "am "+d.slice(0,-1).map(fmtD).join(", ")+" und am "+fmtD(d[d.length-1]);return `von ${fmtD(d[0])} bis ${fmtD(d[d.length-1])} (${d.length} Termine)`}
function wertKopf(b){return b.modus==="avg"?"Durch-schnitt":b.modus==="sum"?"Summe":b.modus==="bestN"?"Summe beste "+(b.bestN||2):b.modus==="last"?"Letztes Ergebnis":"Bestes Ergebnis"}
function beschreibungHTML(t){const out=[];let ul=0;
  String(t||"").split(/\r?\n/).forEach(l=>{const s=l.trim();if(!s)return;
    if(s.startsWith("# "))out.push(`<h2 class="sec">${esc(s.slice(2))}</h2>`);
    else if(s.startsWith("-- "))out.push(`<div class="li2">${esc(s.slice(3))}</div>`);
    else if(s.startsWith("- "))out.push(`<div class="li1">${esc(s.slice(2))}</div>`);
    else out.push(`<p>${esc(s)}</p>`)});return out.join("")}
function druckHTML(b){

  const team=(b.team||"").split(",").map(s=>s.trim()).filter(Boolean);

      if(v==="")return {leer:true};if(v==="x")return {v:mr,x:1};

    const rowState=rid=>{const ins=shots.filter(i=>i.dataset.rid===rid);let v=0,x=0,f=0,warn=[];
      ins.forEach(i=>{const s=shotInfo(i);i.classList.toggle("bad",!!s.warn);if(s.warn)warn.push({k:+i.dataset.k,msg:s.warn});else if(!s.leer){f++;v+=s.v;x+=s.x}});

      [...new Set(shots.map(i=>i.dataset.rid))].forEach(rid=>{const r=S.ergebnisse[rid];if(!r)return;const st=rowState(rid);
        const ser=[...r.serien],xs=[...(r.xs||[])];if(st.f){ser[UI.dgAktiv]=st.v;xs[UI.dgAktiv]=st.x}
        const s=$("#dgsum_"+rid);if(s)s.textContent=num(summe({serien:ser}));const sx=$("#dgx_"+rid);if(sx){const t=xSumme({xs});sx.textContent=t?t+"x":""}
        st.warn.forEach(w=>msgs.push(`Stand ${esc(r.stand||"?")}, Schuss ${w.k+1}: ${esc(w.msg)} – höchstens ${Number(b.serien[UI.dgAktiv].maxRing)||10} Ringe pro Schuss möglich.`))});
      const box=$("#dgWarn");if(box)box.innerHTML=msgs.length?`<div class="notice"><b>⚠ Bitte prüfen:</b><br>${msgs.join("<br>")}</div>`:"";return msgs.length};
    const weiter=i=>{const ix=shots.indexOf(i);if(shots[ix+1])shots[ix+1].focus()}; // kein automatisches Speichern

    });
    document.querySelectorAll("[data-rowx]").forEach(bt=>{bt.addEventListener("mousedown",e=>e.preventDefault());bt.addEventListener("click",()=>{
      const row=shots.filter(i=>i.dataset.rid===bt.dataset.rowx);let t=row.find(i=>i.id===UI.lastShot)||row.find(i=>i.value==="")||row[row.length-1];

    on("dgSave","click",()=>{

      if(si===n-1){ // letzte Serie: nur speichern, wenn jeder Stand einen Namen hat
        const ohne=rids.map(rid=>S.ergebnisse[rid]).filter(r=>r&&!(r.sid&&S.schuetzen[r.sid]));
        if(ohne.length){const box=$("#dgWarnName");if(box)box.innerHTML=`<div class="notice"><b>⚠ Namen fehlen – Serie wurde nicht gespeichert:</b><br>${ohne.map(r=>`Stand ${esc(r.stand||"?")}: noch kein Name zugeordnet.`).join("<br>")}<br>Bitte zuerst die Namen zuordnen und dann „Serie ${si+1} speichern“ tippen.</div>`;
          toast("⚠ Nicht gespeichert – bitte zuerst allen Ständen einen Namen zuordnen.");const s=document.querySelector(`[data-assign="${ohne[0].id}"]`);if(s){s.focus();s.scrollIntoView({block:"center"})}return}
      }
      if(halb.length){const box=$("#dgWarn");if(box)box.innerHTML=`<div class="notice"><b>⚠ Unvollständig:</b><br>${halb.map(o=>`Stand ${esc(o.r.stand||"?")}: ${o.st.f} von ${o.st.n} Schüssen eingetragen (Fehlschuss = 0).`).join("<br>")}</div>`;
        toast("⚠ Nicht alle Schüsse eingetragen.");const f=shots.find(i=>i.dataset.rid===halb[0].r.id&&i.value==="");f&&f.focus();return}
      clearDirty();let leer=0;
      rids.forEach(rid=>{const r=S.ergebnisse[rid];if(!r)return;const st=rowState(rid);
        const ser=[...(r.serien||[])];while(ser.length<n)ser.push(null);const xs=[...(r.xs||[])];while(xs.length<n)xs.push(0);const sch=[...(r.schuss||[])];while(sch.length<n)sch.push("");
        let v,x,txt;
        if(st.f===0){if(sch[si]){v=null;x=0;txt=""}else{if(ser[si]==null||ser[si]==="")leer++;return}}
        else{v=st.v;x=st.x;txt=st.vals.join(",")}
        if(v==null)leer++;
        if(ser[si]===v&&(xs[si]||0)===x&&sch[si]===txt)return;
        ser[si]=v;xs[si]=x;sch[si]=txt;const o={...r,serien:ser,xs,schuss:sch};o.total=summe(o);put("ergebnisse",o)});
      const dg=durchgaenge(S.bewerbe[b.id]).find(d=>d.id===UI.dg);
      if(dg&&dg.fertig){toast("Durchgang "+dg.nr+" – "+b.name+" vollständig – alle Ergebnisse sind in der Wertung.");UI.dg=null;UI.dgSerie=null;render();window.scrollTo(0,0);return}
      else{toast(`${b.serien[si].label} gespeichert${leer?` – ${leer} Stand/Stände leer gelassen`:""}.`);UI.dgSerie=si<n-1?si+1:null}
      render();focusDg();
    });
    on("dgAdd","click",()=>{const st=$("#dgAddStand").value.trim();if(!st)return;const dg=durchgaenge(b).find(d=>d.id===UI.dg);if(!dg)return;
      if(dg.rows.some(r=>String(r.stand)===st)){toast("Stand "+st+" ist schon im Durchgang.");return}
      put("ergebnisse",{id:uid(),bewerbId:b.id,sid:"",stand:st,dg:dg.id,datum:dg.datum,serien:Array(b.serien.length).fill(null),total:0,notiz:"",erstellt:dg.start||new Date().toISOString()})});
    onAll("[data-dgdel]","click",e=>del("ergebnisse",e.dataset.dgdel));
    on("eSave","click",()=>{clearDirty();
      const stand=$("#eStand").value.trim();

      const ps=sers.map(i=>parseSerie(i.value,b.serien[+i.dataset.i],b.zehntel));
      if(ps.some(p=>!p.ok)){toast("Ungültige Serienwerte – rot markiert.");return}
      if(ps.some(p=>p.leer)){toast("Bitte alle Serien ausfüllen (auch 0).");return}
      const vals=ps.map(p=>p.v),xs=ps.map(p=>p.x);

      put("ergebnisse",o);
      toast(sid?`${stand?"Stand "+stand+" · ":""}${sName(S.schuetzen[sid])}: ${num(total)} Ringe gespeichert.`:`Stand ${stand}: ${num(total)} Ringe gespeichert – Name kann später zugeordnet werden.`);
      UI.editErg=null;UI.erfassStand="";

    onAll("[data-editerg]","click",e=>{const r0=S.ergebnisse[e.dataset.editerg];

      UI.editErg=e.dataset.editerg;UI.erfassSid=(S.ergebnisse[e.dataset.editerg]||{}).sid||"";UI.tab="erfassung";render();window.scrollTo(0,0)});
    onAll("[data-namechg]","click",e=>{const r=S.ergebnisse[e.dataset.namechg];if(!r)return;
      bestaetigen(`Stand ${esc(r.stand||"?")} ist <b>${esc(sName(S.schuetzen[r.sid]))}</b> zugeordnet. Möchtest du den Namen wirklich ändern?`,()=>{UI.nameEdit=r.id;render(true);const s=document.querySelector(`[data-assign="${r.id}"]`);s&&s.focus()},"Ja, Namen ändern","");});

function parseStaende(t){const out=[];String(t||"").split(/[\s,;]+/).forEach(p=>{const m=p.match(/^(\d+)\s*-\s*(\d+)$/);
  if(m){let a=+m[1],z=+m[2];if(z<a)[a,z]=[z,a];for(let i=a;i<=z&&out.length<60;i++)out.push(String(i))}else if(/^\d+$/.test(p))out.push(String(+p))});return [...new Set(out)]}
function dateiname(b){return (b.name||"Bewerb").replace(/[^\wäöüÄÖÜß-]+/g,"_")}
function bindForm(b){

  on("fDel","click",()=>{const n=Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id);
    bestaetigen(`Bewerb „${esc(b.name)}“ mit ${n.length} Ergebnis(sen) endgültig löschen? (Personen bleiben erhalten.)`,()=>{n.forEach(r=>del("ergebnisse",r.id));UI.bewerbId=null;del("bewerbe",b.id)})});
  on("fSave","click",()=>{
    const name=$("#fName").value.trim();if(!name){toast("Bitte einen Namen eingeben.");$("#fName").focus();return}
    const prog=$("#fProg").value;
    let serien;
    if(prog==="frei"){const n=Math.min(40,Math.max(1,Number($("#fAnz").value)||1)),sch=Math.max(1,Number($("#fSchuss").value)||5),mr=Math.max(1,Number($("#fMaxRing").value)||10),lb=$("#fLabel").value.trim()||"Serie";
      serien=Array.from({length:n},(_,i)=>({label:lb+" "+(i+1),schuss:sch,maxRing:mr}))}
    else serien=PROGRAMME[prog].serien;
    const alt=b&&b.serien?JSON.stringify(b.serien):null;
    const hatErg=b&&Object.values(S.ergebnisse).some(r=>r.bewerbId===b.id);
    if(hatErg&&alt!==JSON.stringify(serien)&&serien.length!==b.serien.length){toast("Programm mit anderer Serienanzahl kann nach erfassten Ergebnissen nicht geändert werden.");return}
    const modus=$("#fModus").value;
    const o={...(b||{id:uid(),teilnehmer:[],erstellt:new Date().toISOString()}),name,programm:prog,serien,
      start:$("#fStart").value,ende:$("#fEnde").value,jahr:$("#fJahr").value,status:$("#fStatus").value,zehntel:false,
      modus,maxAntritte:$("#fMaxA").value,umlauf:modus!=="best"||!!$("#fEnde").value||!!$("#fMaxA").value&&$("#fMaxA").value!=="1",
      kategorie:$("#fKat").value.trim(),leiter:$("#fLeiter").value.trim(),schuetzenmeister:$("#fSM").value.trim(),team:$("#fTeam").value.trim(),beschreibung:$("#fBeschr").value,waffg:$("#fWaffG").checked,
      interFallback:$("#fInter").checked,s4:$("#fS4").checked,minHinweis:$("#fMin").checked};
    put("bewerbe",o);UI.bewerbId=o.id;UI.tab=b?"einstellungen":"teilnehmer";render();toast(b?"Gespeichert.":"Bewerb angelegt – jetzt Teilnehmer melden.");
  });
}
