function wiederherstellen(data){

  }finally{batch=false;if(backend!=="db")saveLocal();render(true)}

function abgleich(data){
  pruefeDatei(data);
  const st={neu:0,akt:0,del:0,pers:0,alt:0};
  const tot=(coll,id)=>{const t=S.geloescht[coll+"~"+id];return t?t.zeit:""};
  batch=true;
  try{
    // 1. Löschungen vom anderen Gerät übernehmen
    Object.values(data.geloescht||{}).forEach(t=>{
      if(!t||!t.id||!t.rid||!COLLS.includes(t.coll)||t.coll==="geloescht")return;
      const mein=S.geloescht[t.id];if(!mein||mein.zeit<t.zeit)put("geloescht",{...t},true);
      const loc=S[t.coll][t.rid];if(loc&&zeitVon(loc)<=t.zeit){delRaw(t.coll,t.rid);st.del++}
    });
    // 2. Personen (gleiche Person mit anderer ID wird zusammengeführt)
    const map={};
    Object.values(data.schuetzen||{}).forEach(p=>{
      if(!p||!p.id)return;const t=tot("schuetzen",p.id);if(t&&t>=zeitVon(p)){st.alt++;return}
      const loc=S.schuetzen[p.id];
      if(loc){if(zeitVon(p)>zeitVon(loc)){put("schuetzen",{...p},true);st.akt++}else if(zeitVon(p)<zeitVon(loc))st.alt++;return}
      const bekannt=Object.values(S.schuetzen).find(x=>(x.alias||[]).includes(p.id)); // schon früher zusammengeführt
      if(bekannt){map[p.id]=bekannt.id;if(zeitVon(p)>zeitVon(bekannt)){put("schuetzen",{...p,id:bekannt.id,alias:bekannt.alias},true);st.akt++}return}
      const dup=Object.values(S.schuetzen).find(x=>personKey(x)===personKey(p));
      if(dup){map[p.id]=dup.id;st.pers++;const alias=[...new Set([...(dup.alias||[]),p.id])];
        put("schuetzen",zeitVon(p)>zeitVon(dup)?{...p,id:dup.id,alias}:{...dup,alias},true);return}
      put("schuetzen",{...p},true);st.neu++;
    });
    const mid=id=>map[id]||id;
    const tnVereint=(alt,neu)=>{const m={};(alt||[]).forEach(t=>m[t.sid]=t);(neu||[]).forEach(t=>m[t.sid]=t);return Object.values(m)};
    // 3. Bewerbe (Felder: neuerer Stand gewinnt; Teilnehmerlisten werden vereint)
    Object.values(data.bewerbe||{}).forEach(b=>{
      if(!b||!b.id)return;const t=tot("bewerbe",b.id);if(t&&t>=zeitVon(b)){st.alt++;return}
      const tn=(b.teilnehmer||[]).map(x=>({...x,sid:mid(x.sid)}));
      const loc=S.bewerbe[b.id];
      if(!loc){put("bewerbe",{...b,teilnehmer:tnVereint([],tn)},true);st.neu++;return}
      const neuer=zeitVon(b)>zeitVon(loc);
      const basis=neuer?{...b}:{...loc};
      basis.teilnehmer=neuer?tnVereint(loc.teilnehmer,tn):tnVereint(tn,loc.teilnehmer);
      const tnNeu=basis.teilnehmer.length!==(loc.teilnehmer||[]).length;
      if(neuer||tnNeu){put("bewerbe",basis,true);st.akt++}
    });
    // 4. Ergebnisse (jede Zeile eines Durchgangs einzeln: neuerer Stand gewinnt)
    Object.values(data.ergebnisse||{}).forEach(r=>{
      if(!r||!r.id)return;const t=tot("ergebnisse",r.id);if(t&&t>=zeitVon(r)){st.alt++;return}
      const rr={...r,sid:r.sid?mid(r.sid):""};const loc=S.ergebnisse[r.id];
      if(!loc){put("ergebnisse",rr,true);st.neu++}else if(zeitVon(r)>zeitVon(loc)){put("ergebnisse",rr,true);st.akt++}else if(zeitVon(r)<zeitVon(loc))st.alt++
    });
  }finally{batch=false;if(backend!=="db")saveLocal();render(true)}
  try{localStorage.setItem("ksv_letzter_abgleich",JSON.stringify({zeit:new Date().toISOString(),von:data.geraet||"",datei:data.exportiert||""}))}catch(e){}
  return st;
}

function refJahr(b){return Number((b.start||today()).slice(0,4))} // Altersklasse nach dem Jahr des Bewerbsbeginns
function altersKlasse(s,b){
  if(!s.geburtsjahr)return s.geschlecht==="w"?"F":"M";
  const a=refJahr(b)-Number(s.geburtsjahr); // im Kalenderjahr erreichtes Alter
  const w=s.geschlecht==="w";
  if(a>=77)return w?"SW4":"SM4"; // FFWGK 2.1.3/2.1.4: Klasse 4 ab 77
  if(a>=70)return w?"SW3":"SM3";
  if(a>=60)return w?"SW2":"SM2";
  if(a>=50)return w?"SW1":"SM1";
  return w?"F":"M";
}
function maennerKlasse(s,b){return altersKlasse({...s,geschlecht:"m"},b)}
function teilnahme(b,sid){return (b.teilnehmer||[]).find(t=>t.sid===sid)}
function klasseVon(b,sid){
  const t=teilnahme(b,sid);const s=S.schuetzen[sid];if(!s)return "M";
  if(t&&t.gast)return "G";
  if(t&&t.klasse)return t.klasse;
  if(s.geschlecht==="x"){
    if(b.interFallback!==false){
      const nInter=(b.teilnehmer||[]).filter(x=>{const y=S.schuetzen[x.sid];return y&&y.geschlecht==="x"&&!x.gast}).length;
      if(nInter<5)return maennerKlasse(s,b);
    }
    return "I";
  }
  return altersKlasse(s,b);
}
/* Serien-Eingabe: Summe ("47"), Summe + X ("47xx" = 47 Ringe, davon 2 X) oder Einzelschüsse ("x 10 9 9 8"). x = 10er-Treffer (Innenzehner). */
function parseSerie(str,se,zehntel){
  let s=String(str??"").trim().toLowerCase();if(!s)return {leer:true,ok:true};
  s=s.replace(/(\d),(\d)/g,"$1.$2");
  const maxR=Number(se.maxRing)||10,minR=Math.min(0,Number(se.minRing)||0),sch=Number(se.schuss)||5,mx=maxSerie(se),mn=minSerie(se);
  const parts=s.split(/[\s,;+\/]+/).filter(Boolean);let v=0,x=0;
  if(parts.length>1){
    if(parts.length>sch)return {ok:false};
    for(const p of parts){if(/^x+$/.test(p)){x+=p.length;v+=maxR*p.length}else if(/^f+$/.test(p)){}else if(/^-?\d+(\.\d+)?$/.test(p)&&+p<=maxR&&+p>=minR){v+=+p}else return {ok:false}}
  }else{
    const m=parts[0].match(/^(x*)(-?\d+(?:\.\d+)?)?(x*)$/);if(!m)return {ok:false};
    x=m[1].length+m[3].length;v=m[2]!=null?+m[2]:maxR*x;
  }
  v=Math.round(v*10)/10;
  const ok=v>=mn&&v<=mx&&x<=sch&&(minR<0||x*maxR<=v)&&(zehntel||Number.isInteger(v));
  return {ok,v,x};
}
function serText(v,x){return v==null||v===""?"":String(v).replace(".",",")+(x?"x".repeat(x):"")}

function issfBloecke(b){ // Serienindizes je 10-Schuss-Block, vom Ende her

    const s=S.schuetzen[sid];

/* Töne als echte Audiodatei (WAV) – spielt am iPad auch im Stumm-Modus und nach Verzögerung (IPSC) */
function uhrWav(toene){
  const rate=22050,ende=Math.max(...toene.map(([t0,,len])=>t0+len))+0.05,n=Math.ceil(ende*rate),buf=new Float32Array(n);
  toene.forEach(([t0,f,len,vol])=>{const a=Math.floor(t0*rate),b=Math.min(n,Math.floor((t0+len)*rate));for(let i=a;i<b;i++){const tt=(i-a)/rate,sq=Math.sin(2*Math.PI*f*tt)>=0?1:-1,env=Math.min(1,tt/0.005,(len-tt)/0.03);buf[i]+=sq*vol*Math.max(0,env)}});
  const dv=new DataView(new ArrayBuffer(44+n*2)),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,"RIFF");dv.setUint32(4,36+n*2,true);ws(8,"WAVE");ws(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,"data");dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,buf[i]*0.9))*32767,true);
  return URL.createObjectURL(new Blob([dv.buffer],{type:"audio/wav"}));
}

function zuordnen(bid,rid,sid){

function excelDurchgaenge(b){
  const ser=b.serien||[],n=ser.length,dgs=durchgaenge(b).slice().reverse(); // Durchgang 1 zuerst
  const zeit=iso=>{if(!iso)return "";const d=new Date(iso);return isNaN(d)?"":`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
  const kopf=["DG","Datum","Beginn","Status","Stand","Name","Klasse","Kaliber",...ser.map((s,i)=>s.label||`Serie ${i+1}`),"Summe","X","Notiz"];
  const nc=kopf.length,R=[[{v:"Durchgänge – "+b.name,s:1}],[{v:`${dgs.length} Durchgänge · ${dgs.filter(d=>d.fertig).length} abgeschlossen · Stand ${fmtD(today())}`,s:2}],[]],M=[`A2:${colName(nc-1)}2`];
  R.push(kopf.map(v=>({v,s:3})));
  if(!dgs.length)R.push([{v:"Noch keine Durchgänge",s:4}]);
  let i=0;dgs.forEach(d=>{d.rows.forEach(r=>{const alt=(d.nr%2)===1,C=alt?7:5,L=alt?6:4,sc=S.schuetzen[r.sid];
    R.push([{v:d.nr,s:C},{v:r.datum?fmtD(r.datum):"",s:C},{v:zeit(d.start),s:C},{v:d.fertig?"abgeschlossen":"läuft",s:C},{v:r.stand||"",s:C},{v:sc?sName(sc):"— frei —",s:L},{v:sc?KLASSEN[klasseVon(b,sc.id)]||"":"",s:L},{v:r.kal||"",s:C},
      ...Array.from({length:n},(_,k)=>{const v=(r.serien||[])[k];return {v:v==null||v===""?"":Number(v),s:C}}),{v:summe(r),s:C},{v:xSumme(r)||"",s:C},{v:r.notiz||"",s:L}]);i++})});
  R.push([]);R.push([{v:"DG = Durchgang (nach Startzeit nummeriert) · X = Innenzehner · leer = noch nicht erfasst",s:10}]);
  const sh={name:"Durchgänge",rows:R,merges:M,heights:{0:24,1:20},cols:[5,11,8,13,7,26,16,8,...ser.map(()=>8),8,5,22],quer:true};
  sh.rows=[[],[],[],[],...sh.rows];sh.merges=sh.merges.map(m=>m.replace(/([A-Z]+)(\d+)/g,(_,c,x)=>c+(Number(x)+4)));const nh={};Object.entries(sh.heights).forEach(([k,v])=>nh[Number(k)+4]=v);sh.heights=nh;
  return xlsxDatei([sh]);
}


/* ================= Aufstellung / Timetable ================= */
function planAusserhalb(b,d){return !!d&&((b.start&&d<b.start)||(b.ende&&d>b.ende))}
function datumLesen(v){v=(v||"").trim();let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return pruefD(+m[1],+m[2],+m[3]);
  if((m=v.match(/^(\d{1,2})[.\/,\s-](\d{1,2})[.\/,\s-](\d{2}|\d{4})$/))){let y=+m[3];if(y<100)y+=2000;return pruefD(y,+m[2],+m[1])}
  if((m=v.match(/^(\d{2})(\d{2})(\d{4})$/)))return pruefD(+m[3],+m[2],+m[1]);
  return null;
  function pruefD(y,mo,d){const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`}}
function zeitLesen(v){v=(v||"").trim().replace(/\s*uhr$/i,"");let m;
  if((m=v.match(/^(\d{1,2})[:.,h ]?(\d{2})?$/))){const h=+m[1],mi=m[2]!=null?+m[2]:0;if(h<24&&mi<60)return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`}
  if((m=v.match(/^(\d{1,2})(\d{2})$/))){const h=+m[1],mi=+m[2];if(h<24&&mi<60)return `${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}`}
  return null}

/* Eigener Kalender: zeigt den Bewerbszeitraum farbig */
function kalenderWahl(b,wert,ok){
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const start=wert||(b.start&&today()<b.start?b.start:today());
  let y=+start.slice(0,4),m=+start.slice(5,7)-1;
  const MON=["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const zeichne=()=>{
    const erster=new Date(y,m,1),off=(erster.getDay()+6)%7,tage=new Date(y,m+1,0).getDate();let z="";
    for(let i=0;i<off;i++)z+=`<span></span>`;
    for(let d=1;d<=tage;d++){const v=iso(new Date(y,m,d)),drin=(!b.start||v>=b.start)&&(!b.ende||v<=b.ende)&&(b.start||b.ende);
      const cls=["kaltag",drin?"drin":"",v===b.start?"anf":"",v===b.ende?"end":"",v===wert?"gewaehlt":"",v===today()?"heute":""].join(" ");
      z+=`<button type="button" class="${cls}" data-kaltag="${v}">${d}</button>`}
    $("#kalBody").innerHTML=`<div class="kalkopf"><button type="button" class="b g sm" id="kalZur">◀</button><b>${MON[m]} ${y}</b><button type="button" class="b g sm" id="kalVor">▶</button></div>
      <div class="kalgrid kalwt">${["Mo","Di","Mi","Do","Fr","Sa","So"].map(w=>`<span>${w}</span>`).join("")}</div><div class="kalgrid">${z}</div>`;
    $("#kalZur").onclick=()=>{m--;if(m<0){m=11;y--}zeichne()};$("#kalVor").onclick=()=>{m++;if(m>11){m=0;y++}zeichne()};
    document.querySelectorAll("[data-kaltag]").forEach(bt=>bt.onclick=()=>{closeModal();ok(bt.dataset.kaltag)});
  };
  modal(`<h3 style="margin-top:0">Datum wählen</h3><div id="kalBody"></div>
    <p class="small" style="margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap"><span><span class="kallegende drin"></span> Bewerbszeitraum ${b.start?fmtD(b.start):"…"} – ${b.ende?fmtD(b.ende):"…"}</span><span><span class="kallegende heute"></span> heute</span></p>
    <div class="right"><button class="b g" id="kalAbbr">Abbrechen</button><button class="b g" id="kalHeute">Heute</button></div>`,()=>{
    zeichne();$("#kalAbbr").onclick=closeModal;$("#kalHeute").onclick=()=>{closeModal();ok(today())}});
}
function planListe(b){return [...(b.plan||[])].sort((x,y)=>((x.datum||"")+(x.zeit||"")).localeCompare((y.datum||"")+(y.zeit||"")))}
function wochentag(d){try{return ["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(d+"T12:00").getDay()]}catch(e){return ""}}

</div>
      <div class="small muted sp" style="padding-bottom:10px">${p.datum?wochentag(p.datum)+", ":""}${belegt} von ${(p.staende||[]).length} Ständen belegt</div>
      ${gestartet?`<button class="b g" data-planoeffnen="${p.dg}">✓ Durchgang läuft – öffnen</button>`:`<button class="b" data-planstart="${p.id}" ${belegt?"":"disabled"}>▶ Durchgang starten</button>`}
      <button class="b d sm" data-plandel="${p.id}" title="Startzeit löschen">🗑</button>
    </div>
    ${planAusserhalb(b,p.datum)?`<div class="small" style="color:#c25e00;margin-top:6px">⚠ Datum liegt außerhalb des Bewerbszeitraums (${b.start?fmtD(b.start):"…"} – ${b.ende?fmtD(b.ende):"…"})</div>`:""}
    <div class="tw" style="margin-top:6px"><table class="plantab"><thead><tr><th style="width:56px">Stand</th><th>Schütze</th><th style="width:1%">Kaliber</th><th>Notiz</th><th style="width:44px"></th></tr></thead><tbody>
    ${(p.staende||[]).map((s,si)=>`<tr><td><b>${esc(s.stand)}</b></td><td><select data-planwahl="${p.id}|${si}" ${gestartet?"disabled":""} style="max-width:420px">
      <option value="">— frei —</option>${tn.map(x=>{const hier=(p.staende||[]).some((z,zi)=>zi!==si&&z.sid===x.s.id);const sonst=wo(x.s.id).filter((_,i)=>true);const other=plan.filter(q=>q.id!==p.id&&(q.staende||[]).some(z=>z.sid===x.s.id)).map(q=>q.zeit||"").filter(Boolean);
        return `<option value="${x.s.id}" ${s.sid===x.s.id?"selected":""} ${hier?"disabled":""}>${hier?"🔴 ":eingeteilt.has(x.s.id)&&s.sid!==x.s.id?"🟡 ":"🟢 "}${esc(sName(x.s))}${hier?" – schon in dieser Startzeit":other.length?` (auch ${other.join(", ")})`:""}</option>`}).join("")}</select></td>
      <td style="white-space:nowrap"><div style="display:flex;gap:3px">${kaliberErlaubt(b).map(k=>{const an=(s.kal||(kaliberErlaubt(b).length===1?kaliberErlaubt(b)[0]:""))===k;return `<label class="kalbox ${an?"on":""}"><input type="checkbox" data-plankal="${p.id}|${si}|${k}" ${an?"checked":""} ${gestartet?"disabled":""}> ${k}</label>`}).join("")}</div></td>
      <td><input class="plannotiz" data-plannotiz="${p.id}|${si}" value="${esc(s.notiz||"")}" placeholder="z. B. Leihwaffe" maxlength="120" autocomplete="off" ${gestartet?"disabled":""}></td>
      <td>${gestartet?"":`<button class="b d sm" data-planstanddel="${p.id}|${si}" title="Stand entfernen" style="min-width:32px;padding:8px">×</button>`}</td></tr>`).join("")}
    </tbody></table></div>

function planSpeichern(b,fn){const cur=S.bewerbe[b.id];const plan=(cur.plan||[]).map(p=>({...p,staende:(p.staende||[]).map(s=>({...s}))}));fn(plan);put("bewerbe",{...cur,plan})}
function planExcel(b){
  const R=[[],[{v:"Aufstellung – "+b.name,s:1}],[{v:`${VEREIN.name} · Stand: ${fmtD(today())}`,s:2}],[]],M=["A3:H3"];
  R.push(["Datum","Tag","Uhrzeit","Stand","Name","Klasse","Kaliber","Notiz"].map(v=>({v,s:3})));
  let i=0;planListe(b).forEach(p=>(p.staende||[]).forEach(s=>{const sc=S.schuetzen[s.sid];const alt=i++%2===0,L=alt?6:4,C=alt?7:5;
    R.push([{v:p.datum?fmtD(p.datum):"",s:C},{v:p.datum?wochentag(p.datum):"",s:C},{v:p.zeit||"",s:C},{v:s.stand,s:C},{v:sc?sName(sc):"— frei —",s:L},{v:sc?KLASSEN[klasseVon(b,sc.id)]||"":"",s:L},{v:s.kal||(kaliberErlaubt(b).length===1?kaliberErlaubt(b)[0]:""),s:C},{v:s.notiz||"",s:L}])}));
  return xlsxDatei([{name:"Aufstellung",rows:R,merges:M,heights:{0:54,1:24,2:20},cols:[13,7,10,8,30,20,9,26]}]);

function bindZeitplan(b){
  on("planNeu","click",()=>{const pl=planListe(S.bewerbe[b.id]),last=pl[pl.length-1];
    let datum=last?.datum||(b.start&&today()<b.start?b.start:today());if(b.ende&&datum>b.ende)datum=b.ende;
    let zeit="18:00";if(last?.zeit){const [h,m]=last.zeit.split(":").map(Number);const t2=Math.max(9*60,Math.min(19*60,h*60+m+30));zeit=`${String(Math.floor(t2/60)).padStart(2,"0")}:${String(t2%60).padStart(2,"0")}`} // nur 09:00–19:00
    const staende=STANDARD_STAENDE.map(stand=>({stand,sid:""})); // immer die 5 Stände 16–20
    planSpeichern(b,pl2=>pl2.push({id:uid(),datum,zeit,staende}))});
  onAll("[data-plandatum]","change",e=>{const roh=e.value.trim(),pid=e.dataset.plandatum;
    if(!roh){planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.datum=""});return}
    const d=datumLesen(roh);if(!d){toast("Datum bitte als TT.MM.JJJJ eingeben, z. B. 14.11.2026.");e.classList.add("ausserhalb");return}
    planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.datum=d});
    if(planAusserhalb(b,d))toast(`⚠ ${fmtD(d)} liegt außerhalb des Bewerbszeitraums.`)});
  onAll("[data-plandatum]","keydown",(e,ev)=>{if(ev.key==="Enter"){ev.preventDefault();e.blur()}});
  onAll("[data-planzeitwahl]","change",e=>{const v=e.value,pid=e.dataset.planzeitwahl;if(!v)return;planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.zeit=v})});
  onAll("[data-plankalender]","click",e=>{const pid=e.dataset.plankalender,cur=S.bewerbe[b.id],p0=(cur.plan||[]).find(x=>x.id===pid);
    kalenderWahl(cur,p0?.datum||"",v=>{planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.datum=v});if(planAusserhalb(cur,v))toast(`⚠ ${fmtD(v)} liegt außerhalb des Bewerbszeitraums.`)})});
  onAll("[data-planzeit]","change",e=>{const roh=e.value.trim(),pid=e.dataset.planzeit;
    if(!roh){planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.zeit=""});return}
    const z=zeitLesen(roh);if(!z){toast("Uhrzeit bitte als hh:mm eingeben, z. B. 18:30.");const p0=(S.bewerbe[b.id].plan||[]).find(x=>x.id===pid);e.value=p0?.zeit||"";return}
    planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.zeit=z})});
  onAll("[data-planzeit]","keydown",(e,ev)=>{if(ev.key==="Enter"){ev.preventDefault();e.blur()}});
  onAll("[data-planwahl]","change",e=>{const [pid,si]=e.dataset.planwahl.split("|");planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p&&p.staende[si])p.staende[si].sid=e.value})});
  onAll("[data-plankal]","change",e=>{const [pid,si,k]=e.dataset.plankal.split("|");planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p&&p.staende[si])p.staende[si].kal=e.checked?k:""})});
  onAll("[data-plannotiz]","change",e=>{const [pid,si]=e.dataset.plannotiz.split("|");planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p&&p.staende[si])p.staende[si].notiz=e.value.trim()})});
  onAll("[data-plannotiz]","keydown",(e,ev)=>{if(ev.key==="Enter"){ev.preventDefault();e.blur()}});
  onAll("[data-planstanddel]","click",e=>{const [pid,si]=e.dataset.planstanddel.split("|");const pp=(S.bewerbe[b.id].plan||[]).find(x=>x.id===pid),st=pp&&pp.staende[Number(si)];if(!st)return;
    const wer=st.sid&&S.schuetzen[st.sid]?` (eingeteilt: ${esc(sName(S.schuetzen[st.sid]))})`:"";
    bestaetigen(`Stand ${st.stand}${wer} wirklich aus dieser Startzeit löschen?`,()=>planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(p)p.staende.splice(Number(si),1)}),"Ja, löschen")});
  onAll("[data-planstandadd]","click",e=>{const pid=e.dataset.planstandadd,inp=document.querySelector(`[data-planstandneu="${pid}"]`),v=(inp?.value||"").trim();if(!v){toast("Bitte eine Standnummer eingeben.");return}
    planSpeichern(b,pl=>{const p=pl.find(x=>x.id===pid);if(!p)return;if(p.staende.some(s=>s.stand===v)){toast("Stand "+v+" gibt es hier schon.");return}p.staende.push({stand:v,sid:""});p.staende.sort((x,y)=>(Number(x.stand)||999)-(Number(y.stand)||999))});clearDirty()});
  onAll("[data-plandel]","click",e=>{const pid=e.dataset.plandel;bestaetigen("Diese Startzeit aus der Aufstellung löschen? (Ein bereits gestarteter Durchgang bleibt erhalten.)",()=>planSpeichern(b,pl=>{const i=pl.findIndex(x=>x.id===pid);if(i>=0)pl.splice(i,1)}),"Ja, löschen")});
  onAll("[data-planoeffnen]","click",e=>{UI.tab="erfassung";UI.dg=e.dataset.planoeffnen;UI.dgSerie=0;render();window.scrollTo(0,0)});
  onAll("[data-planstart]","click",e=>{const cur=S.bewerbe[b.id],p=(cur.plan||[]).find(x=>x.id===e.dataset.planstart);if(!p)return;
    const datum=p.datum||today();if((cur.start&&datum<cur.start)||(cur.ende&&datum>cur.ende)){toast("Das Datum dieser Startzeit liegt außerhalb des Bewerbszeitraums.");return}
    const go=()=>{const dgid=uid(),now=new Date().toISOString(),n=cur.serien.length,ka=kaliberErlaubt(cur);
      const ab=new Set();p.staende.forEach((s,i)=>{const sid=s.sid&&!ab.has(s.sid)&&teilnahme(cur,s.sid)?s.sid:"";if(sid)ab.add(sid);
        const kal=s.kal&&ka.includes(s.kal)?s.kal:(ka.length===1?ka[0]:"");
        put("ergebnisse",{id:dgid+"-"+i,bewerbId:cur.id,sid,stand:s.stand,dg:dgid,datum,serien:Array(n).fill(null),total:0,notiz:s.notiz||"",erstellt:now,...(kal?{kal}:{})})});
      planSpeichern(cur,pl=>{const q=pl.find(x=>x.id===p.id);if(q)q.dg=dgid});
      UI.tab="erfassung";UI.dg=dgid;UI.dgSerie=0;render();window.scrollTo(0,0);toast("Durchgang gestartet – Namen sind schon eingetragen.")};
    const frei=p.staende.filter(s=>!s.sid).length;
    if(frei)bestaetigen(`${frei} Stand/Stände dieser Startzeit sind noch frei. Trotzdem starten? (Freie Stände kannst du in der Trefferaufnahme noch belegen oder entfernen.)`,go,"Ja, starten");else go()});
  on("planXlsx","click",()=>{try{anbieten(`KSV_Aufstellung_${(b.name||"Bewerb").replace(/[^\wäöüÄÖÜß-]+/g,"_")}.xlsx`,planExcel(S.bewerbe[b.id]),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}catch(x){console.error(x);toast("Excel-Export fehlgeschlagen.")}});
}

  const q=UI.suche.toLowerCase();

function vSchuetzen(){
  const q=UI.suche.toLowerCase();
  const jahr=new Date().getFullYear();
  const GES={w:"weiblich",x:"inter",m:"männlich"};
  const kl=s=>s.geschlecht==="x"?"I":altersKlasse(s,{start:String(jahr)});
  const nb=s=>Object.values(S.bewerbe).filter(b=>teilnahme(b,s.id)).length;
  const so=UI.sSort&&UI.sSort.k!=="name"?UI.sSort:(UI.sSort={k:"nachname",d:1});
  const cmpS=(a,b)=>String(a||"").localeCompare(String(b||""),"de",{sensitivity:"base"});
  const leer=v=>v===""||v==null; // leere Werte immer ans Ende
  const keyf={name:s=>sName(s),nachname:s=>s.nachname,vorname:s=>s.vorname,verein:s=>s.verein,jg:s=>s.geburtsjahr,geschlecht:s=>GES[s.geschlecht]||GES.m,klasse:s=>KLASSEN_ORD.indexOf(kl(s)),bewerbe:s=>nb(s),notiz:s=>s.notiz};
  const list=Object.values(S.schuetzen).filter(s=>!q||sName(s).toLowerCase().includes(q)||(s.verein||"").toLowerCase().includes(q)||(s.notiz||"").toLowerCase().includes(q))
    .sort((x,y)=>{const a=keyf[so.k](x),b=keyf[so.k](y);if(leer(a)!==leer(b))return leer(a)?1:-1;
      const c=typeof a==="number"&&typeof b==="number"?a-b:(so.k==="jg"?Number(a)-Number(b):cmpS(a,b));return c*so.d||cmpS(sName(x),sName(y))});
  const sel=UI.sSel||(UI.sSel=new Set());[...sel].forEach(id=>{if(!S.schuetzen[id])sel.delete(id)});
  const alleAn=list.length&&list.every(s=>sel.has(s.id));
  const th=(k,l,cls)=>`<th class="sortth ${cls||""}" data-ssort="${k}">${l}<span class="sortpfeil">${so.k===k?(so.d>0?" ▲":" ▼"):" ↕"}</span></th>`;
  return `<div class="flex"><h2 class="sp">Schützen</h2><button class="b" id="sNeu">+ Neue Person</button></div>
  <div class="card"><input id="sSuche" placeholder="Suchen nach Name, Verein oder Notiz …" value="${esc(UI.suche)}">
  <div class="selbar" style="min-height:58px;box-sizing:border-box">${sel.size?`<b>${sel.size} ausgewählt</b><button class="b" id="sMulti">✎ Gemeinsam bearbeiten</button><button class="b g" id="sSelLeer">Auswahl aufheben</button>`:`<span class="small muted">Kästchen antippen, um mehrere Schützen gemeinsam zu bearbeiten oder zu löschen.</span>`}</div>
  ${list.length?`<div class="tw" style="margin-top:8px"><table class="schtab"><thead><tr><th class="cbcol"><input type="checkbox" id="sAlle" ${alleAn?"checked":""} title="Alle auswählen"></th>${th("nachname","Nachname")}${th("vorname","Vorname")}${th("verein","Verein")}${th("jg","Jg.")}${th("geschlecht","Geschlecht")}${th("klasse","Klasse "+jahr)}${th("bewerbe","Bewerbe","n")}${th("notiz","Notiz")}</tr></thead><tbody>

function mehrfachLoeschen(ps){
  const mitErg=ps.filter(p=>Object.values(S.ergebnisse).some(r=>r.sid===p.id));
  const weg=ps.filter(p=>!mitErg.includes(p));
  const liste=a=>a.map(p=>esc(sName(p))).join(", ");
  if(!weg.length){modal(`<h3 style="margin-top:0">Löschen nicht möglich</h3><div class="notice">${mitErg.length===1?"Die ausgewählte Person hat":"Alle ausgewählten Personen haben"} bereits Ergebnisse und ${mitErg.length===1?"kann":"können"} nicht gelöscht werden:<br>${liste(mitErg)}</div><div class="right"><button class="b" id="cOk">OK</button></div>`,()=>{$("#cOk").onclick=closeModal});return}
  const hinweisErg=mitErg.length?`<div class="notice" style="margin-top:10px">${mitErg.length} Person${mitErg.length===1?" hat":"en haben"} bereits Ergebnisse und ${mitErg.length===1?"wird":"werden"} <b>nicht</b> gelöscht: ${liste(mitErg)}</div>`:"";
  bestaetigen(`<b style="color:var(--warn);font-size:17px">⚠ ${weg.length} Schützen löschen?</b><br><br>${liste(weg)}${hinweisErg}<br>Die Personen werden auch aus allen Bewerben entfernt, in denen sie gemeldet sind.`,()=>{
    bestaetigen(`<b style="color:var(--warn);font-size:17px">⚠ Zweite Sicherheitsabfrage</b><br><br>Sollen diese <b>${weg.length} Schützen</b> wirklich endgültig gelöscht werden?<br><br>Das kann nicht rückgängig gemacht werden.`,()=>{
      modal(`<b style="color:var(--warn);font-size:17px">⚠ Löschen bestätigen</b><p>Zum endgültigen Löschen von <b>${weg.length} Schützen</b> tippe bitte das Wort <b>löschen</b> in das Feld:</p>
      <input id="delWort" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="löschen" style="max-width:260px">
      <div class="right"><button class="b g" id="cNo">Abbrechen</button><button class="b d" id="cYes" disabled style="opacity:.45">Endgültig löschen</button></div>`,()=>{
        const inp=$("#delWort"),btn=$("#cYes"),ok=()=>inp.value.trim().toLowerCase()==="löschen";
        inp.focus();inp.addEventListener("input",()=>{btn.disabled=!ok();btn.style.opacity=ok()?"1":".45"});
        inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&ok())btn.click()});
        $("#cNo").onclick=closeModal;
        btn.onclick=()=>{if(!ok())return;closeModal();
      const ids=new Set(weg.map(p=>p.id));const ob=batch;batch=true;
      Object.values(S.bewerbe).forEach(b=>{if((b.teilnehmer||[]).some(t=>ids.has(t.sid)))put("bewerbe",{...b,teilnehmer:b.teilnehmer.filter(t=>!ids.has(t.sid))})});
      weg.forEach(p=>del("schuetzen",p.id));batch=ob;if(backend!=="db")saveLocal();
      UI.sSel=new Set();render();toast(`${weg.length} Schützen gelöscht.`+(mitErg.length?` ${mitErg.length} mit Ergebnissen behalten.`:""))}})},"Weiter …")},"Weiter …");
}

const IST_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
async function anbieten(filename,text,mime){
  const blob=text instanceof Blob?text:new Blob([text],{type:mime});
  if(downloads){try{await downloads.save({filename,data:blob});return}catch(e){if(e&&e.code==="declined")return}}
  if(IST_IOS&&navigator.canShare){ // iPad/iPhone: Teilen-Menü (In Dateien sichern, AirDrop, Mail …)
    try{const f=new File([blob],filename,{type:mime||blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}
    catch(e){if(e&&e.name==="AbortError")return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast("Datei „"+filename+"“ wird gespeichert.");return}catch(e){}
  if(typeof text==="string")kopieren(text,"Download nicht möglich – Inhalt wurde in die Zwischenablage kopiert.");else toast("Download nicht möglich.");
}
async function kopieren(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||"In die Zwischenablage kopiert.")}catch(e){
  modal(`<h3 style="margin-top:0">Zum Kopieren markieren</h3><textarea rows="12" id="cpT">${esc(text)}</textarea><div class="right"><button class="b" id="cpX">Schließen</button></div>`,()=>{$("#cpT").select();$("#cpX").onclick=closeModal})}}
const csvCell=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function wertungCSV(b){
  const kals=kaliberListe(b),mitKal=!(kals.length===1&&kals[0]==="");
  const head=["Kaliber","Rang","Nachname","Vorname","Verein","Jahrgang","Geschlecht","Klasse","Durchgänge","Wertung","X",...(b.serien||[]).map(s=>s.label)];
  const lines=[head.join(";")];
  kals.forEach(k=>rangiere(auswertung(b,mitKal?k:undefined)).forEach(r=>lines.push([mitKal?(k||"–"):"",r.rang,r.s?.nachname,r.s?.vorname,r.s?.verein,r.s?.geburtsjahr,r.geschlecht,KLASSEN[r.klasse],r.antritte,num(r.wert,MODUS==="avg"),r.xs||0,...(r.tb||[]).map(v=>num(v))].map(csvCell).join(";"))));
  return "﻿"+lines.join("\r\n");
}
function wertungText(b){
  let t=`${b.name}\n${fmtD(b.start)}${b.ende?" – "+fmtD(b.ende):""}\n`;
  const kals=kaliberListe(b),mitKal=!(kals.length===1&&kals[0]==="");
  kals.forEach(k=>{const all=rangiere(auswertung(b,mitKal?k:undefined));if(mitKal)t+=`\n=== ${KAL[k].toUpperCase()} ===\n`;
  const block=(titel,rows)=>{rows=rangiere(rows);if(!rows.length)return;t+=`\n${titel}\n`;rows.forEach(r=>t+=`${String(r.rang).padStart(3)}. ${sName(r.s)}${r.s?.verein?" ("+r.s.verein+")":""} – ${num(r.wert,MODUS==="avg")}${r.xs?" ("+r.xs+"x)":""}\n`)};
  block("GESAMT",all);
  KLASSEN_ORD.forEach(kl=>block(KLASSEN[kl].toUpperCase(),all.filter(r=>r.klasse===kl)));});

}

function trefferZaehlen(b,r){ // aus den Einzelschüssen; null wenn nicht für alle Serien vorhanden
  const n=(b.serien||[]).length,c={X:0,10:0,9:0,8:0,7:0,6:0,5:0,4:0,3:0,2:0,1:0,F:0};
  for(let i=0;i<n;i++){const t=(r.schuss||[])[i];if(!t)return null;
    t.split(",").forEach(s=>{s=s.trim().toLowerCase();if(s==="x")c.X++;else if(s==="f")c.F++;else{const v=Number(s);if(v===0||isNaN(v))c.F++;else c[String(v)]=(c[String(v)]||0)+1}})}
  return c;
}
function listeDaten(b,kal){
  const rows=rangiere(auswertung(b,kal));
  const maxDG=Math.max(1,...rows.map(r=>r.antritte));
  const chrono=sid=>Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&r.sid===sid&&komplett(b,r)&&(kal===undefined||(r.kal||"")===kal)).sort((x,y)=>(x.datum||"").localeCompare(y.datum||"")||(x.erstellt||"").localeCompare(y.erstellt||""));
  const note=(a,o)=>vektorText(b,a.tv||[a.xs],o.tv||[o.xs],a.kal==="KK");
  rows.forEach((r,i)=>{
    r.dgs=chrono(r.sid);
    let bi=0;r.dgs.forEach((e,k)=>{const be=r.dgs[bi];if(e.total>be.total||(e.total===be.total&&vektorCmp(trefferVektor(b,e),trefferVektor(b,be))<0))bi=k});r.bestIdx=bi;
    const anm=[];const pre=r.dgs.length>1?`DG${bi+1}: `:"";
    const prev=rows[i-1],next=rows[i+1];
    if(next&&next.wert===r.wert)anm.push(pre+note(r,next));else if(prev&&prev.wert===r.wert)anm.push(pre+note(r,prev));
    r.dgs.forEach((e,k)=>{if(e.notiz)anm.push((r.dgs.length>1?`DG${k+1}: `:"")+e.notiz)});
    r.anm=anm.join("; ");
  });
  const details=[];
  rows.forEach(r=>r.dgs.forEach((e,k)=>details.push({name:sName(r.s),kal:e.kal||"",dg:k+1,c:trefferZaehlen(b,e),total:e.total,xs:xSumme(e),tv:trefferVektor(b,e),notiz:e.notiz||""})));
  details.sort((x,y)=>y.total-x.total||vektorCmp(x.tv,y.tv)||x.name.localeCompare(y.name,"de")); // gleiche Reihung wie die Ergebnisliste (GK: FFWGK 8.2.1, KK: ISSF 6.15.1)
  const daten=[...new Set(Object.values(S.ergebnisse).filter(r=>r.bewerbId===b.id&&komplett(b,r)).map(r=>r.datum).filter(Boolean))].sort();
  const klassen=KLASSEN_ORD.filter(k=>rows.some(r=>r.klasse===k)).map(k=>({k,rows:rangiere(rows.filter(r=>r.klasse===k))}));
  const anzDG=durchgaenge(b).filter(d=>d.fertig).length;
  return {rows,maxDG,details,daten,klassen,anzDG};
}
function trefferSpalten(details){ // 4er bis 1er nur, wenn mindestens ein solcher Treffer vorkommt
  const nied=["4","3","2","1"].filter(k=>details.some(d=>d.c&&d.c[k]>0));
  const minus=[...new Set(details.flatMap(d=>d.c?Object.keys(d.c).filter(k=>Number(k)<0&&d.c[k]>0):[]))].sort((a,b)=>Number(b)-Number(a)); // -1, -2, …
  const hoch=[...new Set(details.flatMap(d=>d.c?Object.keys(d.c).filter(k=>Number(k)>10&&d.c[k]>0):[]))].sort((a,b)=>Number(b)-Number(a));
  return ["X",...hoch,"10","9","8","7","6","5",...nied,"F",...minus];
}
function datumText(d){if(!d.length)return "";if(d.length===1)return "am "+fmtD(d[0]);if(d.length===2)return `am ${fmtD(d[0])} und am ${fmtD(d[1])}`;
  if(d.length<=4)return "am "+d.slice(0,-1).map(fmtD).join(", ")+" und am "+fmtD(d[d.length-1]);return `von ${fmtD(d[0])} bis ${fmtD(d[d.length-1])} (${d.length} Termine)`}
function wertKopf(b){return MODUS==="avg"?"Durch-schnitt":MODUS==="sum"?"Summe":MODUS==="bestN"?"Summe beste "+(b.bestN||2):MODUS==="last"?"Letztes Ergebnis":"Bestes Ergebnis"}
function beschreibungHTML(t){const out=[];let ul=0;
  String(t||"").split(/\r?\n/).forEach(l=>{const s=l.trim();if(!s)return;
    if(s.startsWith("# "))out.push(`<h2 class="sec">${esc(s.slice(2))}</h2>`);
    else if(s.startsWith("-- "))out.push(`<div class="li2">${esc(s.slice(3))}</div>`);
    else if(s.startsWith("- "))out.push(`<div class="li1">${esc(s.slice(2))}</div>`);
    else out.push(`<p>${esc(s)}</p>`)});return out.join("")}
function druckHTML(b){

  const zeile=(r,i)=>`<tr class="${i%2?"":"alt"}"><td class="c">${r.rang}</td><td>${esc(sName(r.s))}</td>${Array.from({length:L.maxDG},(_,k)=>{const e=r.dgs[k];return `<td class="c">${e?(r.dgs.length>1&&k===r.bestIdx?`<u>${num(e.total)}</u>`:(r.dgs.length===1?`<u>${num(e.total)}</u>`:num(e.total))):"---"}</td>`}).join("")}<td class="c">${num(r.wert,MODUS==="avg")}</td><td class="c">${r.xs||0}</td><td>${esc(r.anm)}</td></tr>`;
  const team=(b.team||"").split(",").map(s=>s.trim()).filter(Boolean);
  const dc=trefferSpalten(L.details);
  return `<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Ergebnisliste ${esc(b.name)}</title><style>

let PDFJS=null;
async function ladePdfjs(){
  if(PDFJS)return PDFJS;
  const text=async id=>{const el=document.getElementById(id);if(!el)throw new Error("pdf.js fehlt");const bin=Uint8Array.from(atob(el.textContent.trim()),c=>c.charCodeAt(0));
    return await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text()};
  const imp=async src=>{const u=URL.createObjectURL(new Blob([src],{type:"text/javascript"}));try{return await import(u)}catch(e){return await import("data:text/javascript;base64,"+btoa(unescape(encodeURIComponent(src))))}};
  if(!globalThis.pdfjsWorker)globalThis.pdfjsWorker=await imp(await text("pdfjsW")); // Worker im Hauptthread (funktioniert überall)
  const lib=await imp(await text("pdfjsL"));
  PDFJS=lib;return lib;
}
async function pdfZuText(file){ // Zeilen wie im PDF; Leerzeile bei größerem Abstand; große Schrift = Überschrift
  const lib=await ladePdfjs();

  const zeilen=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),tc=await pg.getTextContent(),PHh=pg.getViewport({scale:1}).height;
    const L=[];let cur=null;
    tc.items.forEach(it=>{if(typeof it.str!=="string")return;const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||Math.abs(it.height)||10;
      if(cur&&Math.abs(y-cur.y)>h*0.45){L.push(cur);cur=null}
      if(!cur)cur={t:"",y,h,x0:x,xe:x};
      if(it.str){const gap=x-cur.xe;if(cur.t&&gap>h*1.2)cur.t+=gap>h*4?"     ":" ";else if(cur.t&&gap>h*0.15&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str))cur.t+=" ";
        cur.t+=it.str;cur.xe=x+(it.width||0);cur.h=Math.max(cur.h,h)}
      if(it.hasEOL){L.push(cur);cur=null}});
    if(cur)L.push(cur);
    const ls=L.filter(l=>l.t.trim()&&l.y<PHh*0.92&&l.y>PHh*0.075);if(!ls.length)continue; // ohne Kopf-/Fußzeile
    const hs=ls.map(l=>l.h).sort((a,b)=>a-b),med=hs[Math.floor(hs.length/2)]||10;
    if(zeilen.length)zeilen.push({t:"",s:""});
    ls.forEach((l,i)=>{const prev=ls[i-1];if(prev&&Math.abs(prev.y-l.y)>Math.max(prev.h,l.h)*1.9&&zeilen.length&&zeilen[zeilen.length-1].t)zeilen.push({t:"",s:""});
      const t=l.t.replace(/[\uE000-\uF8FF]/g,"•").replace(/\s+$/,"").replace(/^\s+/,"");zeilen.push({t,s:l.h>med*1.18?"h":"l"})})}
  try{doc.destroy()}catch(e){}
  while(zeilen.length&&!zeilen[zeilen.length-1].t)zeilen.pop();
  return zeilen;
}

      L.push({id:a[0],x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)})}});
  const hol=id=>new Promise(r=>{const t=setTimeout(()=>r(null),8000);try{(id.startsWith("g_")?pg.commonObjs:pg.objs).get(id,o=>{clearTimeout(t);r(o)})}catch(e){clearTimeout(t);r(null)}});

      if(src.length===o.width*o.height*4)d.set(src);else if(src.length===o.width*o.height*3){for(let i=0,j=0;i<src.length;i+=3,j+=4){d[j]=src[i];d[j+1]=src[i+1];d[j+2]=src[i+2];d[j+3]=255}}else return null;

      hg.getContext("2d").drawImage(src,b.x0*S,(H-b.y1)*S,(b.x1-b.x0)*S,(b.y1-b.y0)*S)}
    else{const bw=Math.min(800,Math.round((b.x1-b.x0)*S*1.6)),bh=Math.round(bw*(b.y1-b.y0)/(b.x1-b.x0)),c=document.createElement("canvas");c.width=bw;c.height=bh;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,bw,bh);g.drawImage(src,0,0,bw,bh);
      bilder.push({d:c.toDataURL("image/jpeg",0.85),w:bw,h:bh,x:b.x0/W,bw:(b.x1-b.x0)/W,top:b.y1,hpt:b.y1-b.y0})}}
  return {hg:hg?hg.toDataURL("image/jpeg",0.7):null,bilder,W,H};

async function pdfNachbau(file){ // Variante B: jede Seite neu aufgebaut – Hintergrund + Bilder + Text an Originalposition (Text bleibt Text)
  const lib=await ladePdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  const seiten=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),H=pg.getViewport({scale:1}).height;
    const bi=await pdfSeitenBilder(lib,pg); // lädt dabei auch die Schriften
    const tc=await pg.getTextContent();const texte=[];
    const fett=fn=>{try{const f=pg.commonObjs.get(fn);return /bold|black|heavy|semibold|demi/i.test((f&&(f.name||f.loadedName))||"")||!!(f&&f.bold)}catch(e){return false}};
    tc.items.forEach(it=>{if(typeof it.str!=="string"||!it.str.trim())return;const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||10;
      if(y>H*0.92||y<H*0.075)return;
      texte.push({t:it.str.replace(/[-]/g,"•"),x,y,gr:h,w:it.width||0,fett:fett(it.fontName)})});
    seiten.push({hg:bi.hg,bilder:bi.bilder.map(b=>({d:b.d,x:b.x*bi.W,y:b.top-b.hpt,w:b.bw*bi.W,h:b.hpt})),texte});
  }
  try{doc.destroy()}catch(e){}
  return seiten;
}
